---
#####################################################################################################################################################################################################
# Project:       Juniper
# Application:   juniper-deploy
# File Name:     ci.yml
# Author:        Paul Calnon
# Version:       0.2.0
#
# Date Created:  2026-03-05
# Last Modified: 2026-03-11
#
# License:       MIT License
# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:
#    GitHub Actions CI workflow for juniper-deploy. Pre-commit hooks for YAML,
#    shell, and markdown validation. Validates Docker Compose configuration,
#    builds all service images, starts the dev profile, and verifies health
#    endpoints for all three Juniper services.
#
#####################################################################################################################################################################################################

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Pre-commit: Code Quality Checks (YAML, shell scripts, markdown)
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Cache pre-commit hooks
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-3.12-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-3.12-

      - name: Run pre-commit hooks
        env:
          # Skip docker-compose-check in CI (requires sibling repos checked out)
          SKIP: docker-compose-check
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-deploy - Pre-commit Checks                  ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo "Note: docker-compose-check hook skipped in CI"
          echo "      (handled by dedicated validate-compose job)"
          pre-commit run --all-files --show-diff-on-failure

  # ═══════════════════════════════════════════════════════════════════════════
  # Validate Docker Compose Configuration
  # ═══════════════════════════════════════════════════════════════════════════
  validate-compose:
    name: Validate Compose Config
    runs-on: ubuntu-latest
    needs: [pre-commit]
    steps:
      - name: Checkout juniper-deploy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          path: juniper-deploy

      - name: Checkout juniper-data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: pcalnon/juniper-data
          path: juniper-data

      - name: Checkout juniper-cascor
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: pcalnon/juniper-cascor
          path: juniper-cascor

      - name: Checkout juniper-canopy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: pcalnon/juniper-canopy
          path: juniper-canopy

      - name: Validate full profile
        working-directory: juniper-deploy
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-deploy - Validate Compose Profiles          ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          docker compose --profile full config --quiet

      - name: Validate demo profile
        working-directory: juniper-deploy
        run: docker compose --profile demo config --quiet

      - name: Validate dev profile
        working-directory: juniper-deploy
        run: docker compose --profile dev config --quiet

  # ═══════════════════════════════════════════════════════════════════════════
  # Docker Integration Test
  # ═══════════════════════════════════════════════════════════════════════════
  docker-integration:
    name: Docker Integration
    runs-on: ubuntu-latest
    needs: [validate-compose]
    timeout-minutes: 15
    steps:
      - name: Checkout juniper-deploy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          path: juniper-deploy

      - name: Checkout juniper-data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: pcalnon/juniper-data
          path: juniper-data

      - name: Checkout juniper-cascor
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: pcalnon/juniper-cascor
          path: juniper-cascor

      - name: Checkout juniper-canopy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: pcalnon/juniper-canopy
          path: juniper-canopy

      - name: Build all images
        working-directory: juniper-deploy
        run: docker compose --profile dev build

      - name: Start dev profile
        working-directory: juniper-deploy
        run: docker compose --profile dev up -d

      - name: Wait for services
        working-directory: juniper-deploy
        run: bash scripts/wait_for_services.sh 120

      - name: Verify juniper-data health
        run: |
          STATUS=$(python3 -c "
          import urllib.request, json
          resp = urllib.request.urlopen('http://localhost:8100/v1/health', timeout=10)
          data = json.loads(resp.read().decode())
          print(data.get('status', 'unknown'))
          ")
          echo "juniper-data status: $STATUS"
          [ "$STATUS" = "ok" ]

      - name: Verify juniper-cascor health
        run: |
          STATUS=$(python3 -c "
          import urllib.request, json
          resp = urllib.request.urlopen('http://localhost:8201/v1/health', timeout=10)
          data = json.loads(resp.read().decode())
          if data.get('status') == 'success':
              inner = data.get('data', {}).get('status', 'unknown')
          else:
              inner = data.get('status', 'unknown')
          print(inner)
          ")
          echo "juniper-cascor status: $STATUS"
          [ "$STATUS" = "ok" ] || [ "$STATUS" = "healthy" ]

      - name: Verify juniper-canopy health
        run: |
          STATUS=$(python3 -c "
          import urllib.request, json
          resp = urllib.request.urlopen('http://localhost:8050/v1/health', timeout=10)
          data = json.loads(resp.read().decode())
          print(data.get('status', 'unknown'))
          ")
          echo "juniper-canopy status: $STATUS"
          [ "$STATUS" = "healthy" ]

      - name: Teardown
        if: always()
        working-directory: juniper-deploy
        run: docker compose --profile dev down

      - name: Capture diagnostics on failure
        if: failure()
        working-directory: juniper-deploy
        run: |
          echo "=== Container Status ==="
          docker compose --profile dev ps -a || true
          echo ""
          echo "=== Service Logs (last 50 lines per service) ==="
          docker compose --profile dev logs --tail 50 || true

  # ═══════════════════════════════════════════════════════════════════════════
  # Quality Gate
  # ═══════════════════════════════════════════════════════════════════════════
  required-checks:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [pre-commit, validate-compose, docker-integration]
    steps:
      - name: Check Quality Gate Status
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-deploy - Quality Gate Status                ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Pre-commit:         ${{ needs.pre-commit.result }}"
          echo "Validate Compose:   ${{ needs.validate-compose.result }}"
          echo "Docker Integration: ${{ needs.docker-integration.result }}"
          echo ""

          if [[ "${{ needs.pre-commit.result }}" != "success" ]]; then
            echo "::error::Pre-commit checks failed"
            exit 1
          fi

          if [[ "${{ needs.validate-compose.result }}" != "success" ]]; then
            echo "::error::Compose validation failed"
            exit 1
          fi

          if [[ "${{ needs.docker-integration.result }}" != "success" ]]; then
            echo "::error::Docker integration tests failed"
            exit 1
          fi

          echo "::notice::Quality Gate PASSED"
