---
#####################################################################################################################################################################################################
# Project:       Juniper
# Application:   juniper-deploy
# File Name:     ci.yml
# Author:        Paul Calnon
#
# Date Created:  2026-04-05
# Last Modified: 2026-04-05
#
# License:       MIT License
# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:
#    GitHub Actions CI pipeline for juniper-deploy.
#    - Pre-commit hooks (shellcheck, yamllint, SOPS env validation)
#    - SOPS encryption structural validation
#    - Docker Compose config validation (all profiles)
#    - Required-checks quality gate
#
#####################################################################################################################################################################################################

name: CI Pipeline

on:
  push:
    # Topic-branch globs (feature/**, fix/**) removed 2026-08-13: once a PR is open,
    # `push` and `pull_request` BOTH fire for the same commit, so every job ran twice.
    # The concurrency group is keyed on github.ref, which differs between a branch push
    # (refs/heads/...) and a PR (refs/pull/N/merge), so cancel-in-progress never collapsed
    # the pair. Same fix as juniper-recurrence#108 / juniper-ml#1076 / juniper-canopy#488.
    # `pull_request` covers every commit once a PR exists; workflow_dispatch remains for a
    # branch with no PR open.
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Pre-commit: Code Quality Checks
  # ═══════════════════════════════════════════════════════════════════════════
  pre-commit:
    # One leg per Python version. The owner asked on 2026-11-15 that this job "also run on 3.13 and
    # 3.14, with these checks treated the same as the existing 3.12 check", so all three legs BLOCK:
    # no leg is `experimental` and the job has no `continue-on-error`, so a failure on any leg fails
    # this job, and so the Quality Gate, which reads `needs.pre-commit.result`. Ruleset 14715370
    # requires the VERSION-LESS context `Pre-commit`. A static name would post `Pre-commit (3.12)`
    # and so on, the required context would never report, and every pull request would wait for it
    # forever. A name that references `matrix` is used verbatim, as in the `tests` job below: the
    # 3.12 leg posts exactly `Pre-commit`, and the others `Pre-commit (Python 3.13)` and
    # `Pre-commit (Python 3.14)`. No pre-commit leg runs 3.15 (the owner's ruling of 2026-11-14,
    # phase 1 of the ecosystem's Python 3.15 migration).
    name: ${{ matrix.python-version == '3.12' && 'Pre-commit' || format('Pre-commit (Python {0})', matrix.python-version) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install pre-commit

      - name: Cache pre-commit hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          # One cache per leg: pre-commit builds the Python hook environments with the interpreter
          # it runs under, so a 3.13 leg has no use for the 3.12 leg's environments.
          key: pre-commit-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Run pre-commit hooks
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-deploy - Pre-commit Checks                   ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          pre-commit run --all-files --show-diff-on-failure

      - name: Validate SOPS encryption on .enc files
        run: |
          echo "Checking for .enc files that lack SOPS metadata..."
          bash scripts/validate_sops_encryption.sh

  # ═══════════════════════════════════════════════════════════════════════════
  # Gitleaks: Secret Detection (full git history)
  # Mirrors the pattern used by juniper-cascor / juniper-data /
  # juniper-canopy / juniper-ml. The .gitleaks.toml allowlist already
  # exempts age public keys and SOPS ciphertext envelopes.
  # ═══════════════════════════════════════════════════════════════════════════
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        # A pull request is scanned by the two steps after this one instead:
        # the action's own pull_request path never reaches past the pull
        # request's 30th commit, and at any length its --first-parent walk
        # drops what a merge brought in (see "Run Gitleaks over the pull
        # request"). `push` and `workflow_dispatch`, this workflow's other two
        # events, still run the action.
        if: github.event_name != 'pull_request'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # v3.0.0's action.yml already declares `using: "node24"`, so this
          # opt-in (added for v2.3.9's Node 20) no longer changes anything.
          # It stays so that this change leaves the action's environment as
          # it was; drop it in a change of its own.
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
          # The engine version, stated rather than inherited: gitleaks-action
          # v3.0.0 defaults to this same 8.24.3 (src/index.js at the pinned
          # SHA), but a bump of the action SHA would change it silently, and
          # split the engine between pushes and pull requests.
          # tests/test_gitleaks_config.py and tests/test_gitleaks_pr_scan.py
          # pin it; the second also pins the pull-request install below to
          # the same version.
          GITLEAKS_VERSION: "8.24.3"
        # The action declares no inputs (action.yml at the pinned SHA), so
        # there is no `fail:` to pass; it exits non-zero on a leak by itself,
        # and uploads its report as the `gitleaks-results.sarif` artifact.
        # What it scans (src/index.js / src/gitleaks.js at the pinned SHA):
        # `push` scans `--no-merges --first-parent <first>^..<last>` across the
        # push payload's commits (`-1` when it holds one); `workflow_dispatch`
        # passes no --log-opts, so it scans EVERY commit reachable from every
        # branch and tag of this fetch-depth-0 checkout.
        # .gitleaks.toml and .gitleaksignore are auto-discovered at the repo
        # root. Until 2026-10-25 .gitleaks.toml had no `[extend]` table, so
        # this job ran with ZERO rules and could not fail.

      - name: Install Gitleaks (pull request)
        # The same engine the action installs, fetched by version and checked
        # against the release's published SHA-256 (the linux_x64 line of
        # gitleaks_8.24.3_checksums.txt) before anything runs it. A bump moves
        # GITLEAKS_VERSION here and on the action step, and this digest,
        # together: tests/test_gitleaks_pr_scan.py pins all three. On PATH it
        # is also the binary both Gitleaks self-tests run on a pull request.
        if: github.event_name == 'pull_request'
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
        run: |
          if [ "${RUNNER_OS}/${RUNNER_ARCH}" != "Linux/X64" ]; then
            echo "::error title=Gitleaks::the pinned digest is for linux_x64, and this runner is ${RUNNER_OS}/${RUNNER_ARCH}"
            exit 1
          fi
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          dest="${RUNNER_TEMP}/gitleaks-${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --max-time 120 \
            --output "${RUNNER_TEMP}/${asset}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${asset}" | sha256sum --check --strict
          mkdir -p "${dest}"
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${dest}" gitleaks
          echo "${dest}" >> "${GITHUB_PATH}"
          "${dest}/gitleaks" version

      - name: Run Gitleaks over the pull request (Secrets Detection)
        # gitleaks-action v3.0.0 lists a pull request's commits with ONE
        # unpaginated call, GET /repos/{owner}/{repo}/pulls/{n}/commits (30
        # per page by default, oldest first), and scans
        # `--no-merges --first-parent <first>^..<last>` across that page
        # (src/gitleaks.js at the pinned SHA). Commit 31 onwards is never
        # scanned, and because the walk starts from the page's last commit,
        # --first-parent drops every commit a merge brought into the branch
        # on a pull request of any length: on juniper-ml#1797 (88 commits) it
        # scanned 12, and 11 of those were already on main. This step scans
        # every commit in base..head from the event payload instead, with the
        # action's detect flags (not its --no-merges --first-parent), the
        # same auto-discovered .gitleaks.toml and .gitleaksignore (this
        # repository has both: the .gitleaks.toml described on the action
        # step, and a .gitleaksignore of commit-scoped entries), and the
        # action's outcomes: a leak fails the step with 1, any other gitleaks
        # failure with its own code.
        # --remerge-diff (git 2.36 or later) gives each two-parent merge
        # commit in the range a patch of what it changed beyond a plain
        # re-merge of its parents, such as a conflict resolution, which
        # `git log -p` alone prints for no merge commit; a clean merge prints
        # nothing. git prints no such patch for an octopus merge (`diff:
        # warning: Skipping remerge-diff for octopus merges.`), so the step
        # refuses a range that holds one.
        # The engine runs git through a filter that deletes the notes
        # --remerge-diff writes into a merge's file headers (`remerge
        # CONFLICT ...`, `remerge warning: ...`). gitleaks 8.24.3 parses the
        # log with go-gitdiff v0.9.1, which ends a file header at a line it
        # does not know and re-reads any preamble holding the word "commit"
        # as a commit header. With the notes left in, a finding in the
        # conflicted file was named b/<path>, and a note naming
        # .pre-commit-config.yaml, or quoting a parent subject such as
        # "pre-commit autoupdate", dropped the merge's SHA from that finding
        # and every later one in the merge: their fingerprints were then
        # file-scoped, and no .gitleaksignore entry could match them. In
        # `git log -p` output no patch line and no commit-message line starts
        # with "remerge ", so the filter deletes nothing the engine scans
        # (8.24.3 runs git only for log -p and ls-remote --get-url; the filter
        # edits every call's stdout, so an engine bump re-checks that list).
        # It passes git's stderr through and, with pipefail, git's exit
        # status: gitleaks fails on any git log stderr line, and reads the
        # exit status of `git ls-remote --get-url` to tell a missing remote
        # from a failure.
        # fetch-depth: 0 above is what puts both SHAs in the checkout.
        # The shell below is juniper-data's (juniper-data#530), unchanged;
        # tests/test_gitleaks_pr_scan.py runs it against the real engine.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          for sha in "${BASE_SHA}" "${HEAD_SHA}"; do
            if ! [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "::error title=Gitleaks::'${sha}' is not a commit in this checkout, so the pull request cannot be scanned"
              exit 1
            fi
          done
          range="${BASE_SHA}..${HEAD_SHA}"
          count="$(git rev-list --count "${range}")"
          echo "Scanning ${count} commit(s) in ${range}; the pull request reports ${PR_COMMITS}."
          if [ "${count}" != "${PR_COMMITS}" ]; then
            echo "::warning title=Gitleaks::${range} holds ${count} commit(s), and the pull request reports ${PR_COMMITS}"
          fi
          octopus="$(git rev-list --count --min-parents=3 "${range}")"
          if [ "${octopus}" != "0" ]; then
            echo "::error title=Gitleaks::${range} holds ${octopus} octopus merge(s): --remerge-diff prints no patch for a merge of three or more parents, so what it changed itself cannot be scanned; replace it with two-parent merges"
            exit 1
          fi
          real_git="$(command -v git)"
          filter="${RUNNER_TEMP:?}/gitleaks-git-filter"
          mkdir -p "${filter}"
          cat > "${filter}/git" <<'FILTER'
          #!/usr/bin/env bash
          set -o pipefail
          "${REAL_GIT:?}" "$@" | LC_ALL=C sed -e '/^remerge /d'
          FILTER
          chmod +x "${filter}/git"
          mkdir -p reports/security
          rc=0
          REAL_GIT="${real_git}" PATH="${filter}:${PATH}" gitleaks detect --redact -v --exit-code=2 --report-format=sarif --report-path=reports/security/gitleaks.sarif --log-level=debug "--log-opts=--remerge-diff ${range}" || rc=$?
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            printf '### Gitleaks\n\n%s commit(s) scanned in %s; gitleaks exited %s.\n' "${count}" "${range}" "${rc}" >> "${GITHUB_STEP_SUMMARY}"
          fi
          case "${rc}" in
            0) ;;
            2)
              echo "::error title=Gitleaks::leaks detected in ${range}; the redacted findings are in this log and in reports/security/gitleaks.sarif"
              exit 1
              ;;
            *)
              echo "::error title=Gitleaks::gitleaks exited ${rc}, which is not a scan result"
              exit "${rc}"
              ;;
          esac

      - name: Upload Gitleaks Report
        # This job uploaded no report of its own until the pull-request scan
        # above: the action uploads its `gitleaks-results.sarif` artifact on
        # push and workflow_dispatch, and still does. On a pull request the
        # scan writes reports/security/gitleaks.sarif, and this step uploads
        # it as the `gitleaks-report` artifact, also when the scan has failed
        # (a leak fails the scan step, and the report holds its redacted
        # findings). On push and workflow_dispatch nothing writes that
        # directory: `ignore` keeps those runs free of the "No files were
        # found" warning that the default `warn` would annotate every one of
        # them with, and `error` would fail the required check on each.
        # tests/test_gitleaks_pr_scan.py pins this step.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: gitleaks-report
          path: reports/security/
          if-no-files-found: ignore
          retention-days: 30

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install -r requirements-test.txt

      - name: Gitleaks config self-test (real engine)
        # The Unit Tests job runs this file too, but with no gitleaks binary
        # its real-engine cases skip. Here the binary is on PATH (the Run
        # Gitleaks step put it there, or on a pull request the Install
        # Gitleaks step did), and GITLEAKS_PARITY_REQUIRED turns a missing
        # binary into a failure instead of a skip, because a check that could
        # not run is not a pass: the built-in ruleset must fire on a
        # fabricated token through the auto-discovered .gitleaks.toml (the
        # config is not vacuous).
        env:
          GITLEAKS_PARITY_REQUIRED: "1"
        run: pytest tests/test_gitleaks_config.py -v --tb=short

      - name: Gitleaks pull-request scan self-test (real engine)
        # The Unit Tests job runs this file too (its `pytest tests/` selects
        # every file there), but with no gitleaks binary its real-engine cases
        # skip. Here the binary is on PATH, as for the step above, and
        # GITLEAKS_PARITY_REQUIRED turns a missing binary into a failure
        # instead of a skip, because a check that could not run is not a pass:
        # with the ruleset this repository's scan loads (each case's scratch
        # repository carries this repository's .gitleaks.toml and
        # .gitleaksignore), the pull-request scan step's own shell must find a
        # token in the 35th commit of a 35-commit range, one a merge brought
        # in, and one that a merge commit itself added. Its pytest, PyYAML and
        # requests (tests/conftest.py imports it) come from Install test
        # dependencies; one -v, because pyproject.toml's addopts carry no -q,
        # and no --timeout, because requirements-test.txt installs no
        # pytest-timeout (each case bounds its own subprocesses).
        env:
          GITLEAKS_PARITY_REQUIRED: "1"
        run: pytest tests/test_gitleaks_pr_scan.py -v --tb=short

  # ═══════════════════════════════════════════════════════════════════════════
  # SOPS Encryption Validation
  # ═══════════════════════════════════════════════════════════════════════════
  sops-validation:
    name: SOPS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check for encrypted files
        id: check-enc
        run: |
          ENC_FILES=$(find . -name '*.env.enc' -o -name '*.env.secrets.enc' 2>/dev/null)
          if [ -z "$ENC_FILES" ]; then
            echo "No encrypted files found — skipping validation."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Found encrypted files:"
            echo "$ENC_FILES"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate SOPS metadata structure
        if: steps.check-enc.outputs.skip != 'true'
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-deploy - SOPS Structural Validation          ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          exit_code=0
          for file in $(find . -name '*.env.enc' -o -name '*.env.secrets.enc'); do
            echo "Validating: $file"

            # Check for required SOPS metadata fields
            for key in sops_version sops_lastmodified; do
              if ! grep -q "^${key}=" "$file" 2>/dev/null; then
                echo "  FAIL: Missing SOPS metadata key: ${key}"
                exit_code=1
              fi
            done
            # Check for age recipient (prefix match — supports multiple recipients)
            if ! grep -q "^sops_age__" "$file" 2>/dev/null; then
              echo "  FAIL: Missing SOPS age recipient metadata"
              exit_code=1
            fi

            # Check that all value lines contain SOPS ciphertext
            plaintext=$(grep -v '^#' "$file" | grep -v '^sops_' | grep -v '^$' | grep -cv 'ENC\[AES256_GCM,' 2>/dev/null) || plaintext=0
            if [ "$plaintext" -gt 0 ]; then
              echo "  FAIL: $plaintext line(s) contain non-encrypted values"
              exit_code=1
            else
              echo "  PASS: All values are SOPS-encrypted"
            fi
          done
          exit $exit_code

  # ═══════════════════════════════════════════════════════════════════════════
  # Unit/Integration Tests: pytest tests/
  # require_* fixtures auto-skip live-service tests when Docker isn't running,
  # so this job exercises offline tests (compose config, script regressions,
  # script security, availability fixture wiring) and skips the rest cleanly.
  # ═══════════════════════════════════════════════════════════════════════════
  tests:
    # One leg per Python version: the owner ruled on 2026-11-14 that juniper-deploy gets a 3.12-3.15
    # matrix (phase 1 of the ecosystem's Python 3.15 migration). This job and `pre-commit` have one;
    # every other job runs on `env.PYTHON_VERSION`. Ruleset 14715370 requires the VERSION-LESS context
    # `Unit Tests`. A static name would post `Unit Tests (3.12)` and so on, the required context
    # would never report, and every pull request would wait for it forever. A name that references
    # `matrix` is used verbatim, with no values appended: the 3.12 leg posts exactly `Unit Tests`,
    # and the others `Unit Tests (Python 3.13)`, `(Python 3.14)` and `(Python 3.15)`. The ruleset
    # requires none of those three; requiring 3.13 and 3.14 is the owner's call.
    name: ${{ matrix.python-version == '3.12' && 'Unit Tests' || format('Unit Tests (Python {0})', matrix.python-version) }}
    runs-on: ubuntu-latest
    # 3.13 and 3.14 BLOCK all the same: a failure there fails this job, and so the Quality Gate,
    # which reads `needs.tests.result`. The Python 3.15 leg is INFORMATIONAL: its results show, but
    # it must block no merge. It is the only leg with `experimental: true`, so this expression is
    # true on it alone: a failure there leaves the job's result, and so `needs.tests.result`, at
    # `success`. Measured on juniper-data#538 (run 43655144734), where that repo's gate printed
    # "Unit Tests: success" with its 3.15 leg failed on purpose. Its context is in no ruleset. Keep
    # both until the owner makes 3.15 a required version (phase 3 of the migration).
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        include:
          # Informational, never required: see the comment above `continue-on-error`.
          - python-version: "3.15"
            experimental: true
    steps:
      - name: Checkout Code
        id: checkout-code
        continue-on-error: ${{ matrix.experimental == true }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        id: set-up-python
        continue-on-error: ${{ matrix.experimental == true }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        id: install-test-dependencies
        continue-on-error: ${{ matrix.experimental == true }}
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install -r requirements-test.txt

      - name: Run pytest
        id: run-pytest
        continue-on-error: ${{ matrix.experimental == true }}
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-deploy - Unit Tests                          ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          pytest tests/ -v --tb=short

      # The three steps below lint the repository, not the interpreter, so they run on the 3.12 leg
      # alone, the one that posts the required `Unit Tests`: that context runs exactly the steps it
      # ran before the matrix, and the 3.13, 3.14 and 3.15 legs run pytest only.
      #
      # Catches the failure class that broke 3 juniper-X CIs on
      # 2026-05-18: a workflow that invokes ``python|bash <path>`` after
      # the path was renamed or moved. The test discovers this repo
      # root via a ``.github/workflows/`` walk-up (location-agnostic),
      # so the file at util/test_workflow_script_paths.py can be moved
      # around freely. Mirror of juniper-ml#267's per-PR lint, ported
      # to deploy per juniper-ml notes/CI_CLEANUP.md item 3.
      # PyYAML is already installed via requirements-test.txt above.
      - name: Lint .github/workflows/ script paths
        id: lint-github-workflows-script-paths
        continue-on-error: ${{ matrix.experimental == true }}
        if: matrix.python-version == '3.12'
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Workflow script-path lint                            ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          python3 -m unittest -v util/test_workflow_script_paths.py

      # Pins AGENTS.md's header bullet block to the canonical six-field
      # schema (Project / Repository / Author / License / Version /
      # Last Updated, in that relative order). Currency of the
      # `**Last Updated**` field is maintained by the
      # `.github/workflows/agents-md-touch-up.yml` workflow (auto-bumps
      # on every PR push). Shipped as the
      # ``juniper-lint-agents-md-header`` console script in
      # ``juniper-ci-tools>=0.4.0`` (juniper-ml#319). Deploy does not
      # yet use the PyPI-shared workflow-paths lint, so this is the
      # first ci-tools install in this workflow.
      #
      # Pin healed 2026-08-08 (sequence-safety rollout W2, decision D4): the
      # prior ``<0.7.0`` ceiling excluded the current ci-tools line and would
      # have diverged from the sequence-safety workflows' ``>=0.8.0,<0.9.0``
      # pin. 0.8.0 still ships ``juniper-lint-agents-md-header`` (verified),
      # so this step is unaffected by the widen.
      - name: Install juniper-ci-tools (agents-md header-schema lint)
        id: install-juniper-ci-tools-agents-md-heade
        continue-on-error: ${{ matrix.experimental == true }}
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "juniper-ci-tools>=0.9.0,<0.10.0"

      - name: Lint AGENTS.md header schema
        id: lint-agents-md-header-schema
        continue-on-error: ${{ matrix.experimental == true }}
        if: matrix.python-version == '3.12'
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       AGENTS.md header-schema lint                         ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          juniper-lint-agents-md-header

      - name: Report the informational Python 3.15 result
        # Python 3.15 is INFORMATIONAL (phase 1 of the 3.15 migration). On the 3.15 leg every step above
        # carries `continue-on-error: ${{ matrix.experimental == true }}`, so a failing step neither stops
        # this job nor turns its check red, and no merge, push or deployment waits on it. This step says
        # what failed instead: a warning annotation, and a table in the job summary.
        if: always() && matrix.experimental == true
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          PY_LEG: ${{ matrix.python-version }}
        run: |
          python3 - <<'PY'
          import json, os
          steps = json.loads(os.environ["STEPS_JSON"])
          leg = os.environ["PY_LEG"]
          failed = [k for k, v in steps.items() if v.get("outcome") not in ("success", "skipped")]
          rows = "\n".join(f"| `{k}` | {v.get('outcome')} |" for k, v in steps.items())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(f"### Python {leg}: informational, blocks nothing\n\n| Step | Outcome |\n|---|---|\n{rows}\n")
          if failed:
              print(f"::warning title=Python {leg} (informational)::{len(failed)} step(s) failed on Python {leg}: {', '.join(failed)}. Nothing is blocked; see this job's summary.")
          else:
              print(f"::notice title=Python {leg} (informational)::every step passed on Python {leg}")
          PY

  # ═══════════════════════════════════════════════════════════════════════════
  # Docker Compose: Validate configuration for all profiles
  # ═══════════════════════════════════════════════════════════════════════════
  validate-compose:
    name: Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Create stub build contexts and secrets
        run: |
          # docker compose config needs build context dirs and secret files to exist
          for dir in ../juniper-data ../juniper-cascor ../juniper-canopy; do
            mkdir -p "$dir"
            echo "FROM scratch" > "$dir/Dockerfile"
          done
          mkdir -p secrets
          for f in juniper_data_api_keys.txt juniper_cascor_api_key.txt cascor_sentry_dsn.txt; do
            echo "stub" > "secrets/$f"
          done

      - name: Validate all profiles
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-deploy - Compose Config Validation           ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          exit_code=0
          for profile in full demo dev test observability; do
            echo ""
            echo "--- Profile: ${profile} ---"
            if docker compose --profile "$profile" config --quiet 2>&1; then
              echo "  PASS: ${profile}"
            else
              echo "  FAIL: ${profile}"
              exit_code=1
            fi
          done
          echo ""
          echo "--- Combined: full + observability ---"
          if docker compose --profile full --profile observability config --quiet 2>&1; then
            echo "  PASS: full + observability"
          else
            echo "  FAIL: full + observability"
            exit_code=1
          fi
          exit $exit_code

  # ═══════════════════════════════════════════════════════════════════════════
  # Documentation Links: validate every relative markdown link resolves
  # ═══════════════════════════════════════════════════════════════════════════
  # Tier 2 CI hardening (juniper-ml 2026-08-13): juniper-deploy ships ~45 markdown
  # files, including the operator-facing docs/ set, with no link validation at all —
  # while all 8 sibling repos gate on this. Uses the published juniper-doc-tools
  # validator, same as every sibling.
  docs:
    name: Documentation Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install juniper-doc-tools
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "juniper-doc-tools>=0.1.0,<0.2.0"

      - name: Validate Documentation Links
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-deploy - Documentation Link Validation       ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          # --cross-repo skip: the weekly docs-full-check.yml in juniper-ml owns the
          # cross-repo pass; per-PR we only validate links that resolve in-repo.
          juniper-check-doc-links \
            --exclude history \
            --exclude legacy \
            --exclude CHANGELOG.md \
            --exclude tmp \
            --cross-repo skip

  # ═══════════════════════════════════════════════════════════════════════════
  # Security: pip-audit for dependency vulnerabilities
  # ═══════════════════════════════════════════════════════════════════════════
  # Tier 2 CI hardening (juniper-ml 2026-08-13): juniper-deploy had no dependency
  # CVE screen. Audits requirements-test.txt — the only dependency manifest in the
  # repo. --strict is intentionally omitted to match the per-PR contract used by the
  # siblings (a skipped dependency must not fail every PR); the hard weekly screen
  # lives in juniper-ml's security-scan.yml.
  security:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run pip-audit
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-deploy - pip-audit Security Scan             ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          python -m pip install --upgrade "pip>=26.1.1"
          pip install pip-audit
          pip-audit --desc on --requirement requirements-test.txt

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Memory Budget (BLOCKING, standalone): P5 port of juniper-ml's size ratchet.
  # Plan: juniper-ml notes/JUNIPER_2026-08-18_JUNIPER-ML_SHARED-SESSION-MEMORY-PLAN.md (§P5);
  # tracking issue juniper-ml#1326. Rendered by juniper-ml's
  # util/ad-hoc/2026-08-25_p5_port_memory_budget.py from figures measured IN THIS REPO on
  # 2026-08-25 -- re-measure, never transcribe.
  #
  # WHY THE RATE AXIS SHIPS FIRST, AND ALONE. juniper-ml's AGENTS.md grew ~20x in six months
  # WHILE UNDER FOUR ACTIVE CI GATES -- every one of them enforced structure or currency and
  # none enforced SIZE; 172 of 200 main-line merges grew it against 14 that shrank it, by 2,628
  # bytes between them. A cut without a ceiling is undone in ~44 days, and a ceiling set AFTER a
  # cut locks in the inflated level. So the ceiling lands first and the cut comes later; this job
  # carries no relocation check yet, because juniper-deploy has not cut anything to check.
  #
  # STANDALONE, and deliberately ABSENT from any Quality Gate `needs:` (plan correction C9). A
  # `needs:` entry is the wrong promotion mechanism: it makes a skip on a non-PR event fail the
  # gate. Promotion happens in the branch RULESET, the same way Sequence Safety was promoted --
  # and only after the soak below -- which ended 2026-08-26: `--advisory` is gone and the three
  # negative controls were re-run against the non-advisory job (plan §P5 step d).
  #
  # BLOCKING as of 2026-08-26 (plan §P5 step d). The job soaked with `--advisory` from the port's merge,
  # and the flag was removed only after three negative controls passed IN THIS REPO against the
  # non-advisory invocation -- clean tree exits 0, growth past the ceiling exits 1, and a waiver
  # trailer exits 0 -- because a blocking gate that cannot fail is worse than none. Whether this
  # context is REQUIRED is decided in the branch ruleset, never here.
  #
  # SLACK, MEASURED HERE. The ceiling was seeded at the exact size on the day the port landed
  # (34,569 chars, zero slack) and raised 2026-08-26 to 36,569 (+2,000) under an Allow-Ceiling-
  # Raise: AGENTS.md trailer. The slack is the largest single AGENTS.md-growing commit re-measured
  # over the 30 days to 2026-08-26 (1,982; median 1,982, 1 grew / 0 shrank, ~66 chars/day),
  # floored at 2,000 because one fleet-wide docs fan-out (2026-08-21) added 1,982 chars to six
  # repos' AGENTS.md at once -- the shape a zero-slack ceiling cannot absorb. Growth past the
  # ceiling now FAILS this check; Allow-Budget-Overrun: AGENTS.md is the loan for a warranted
  # overrun, and a cut is what brings the ceiling back down (hand-edit with slack, never bare
  # --ratchet).
  memory-budget:
    name: Memory Budget
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      contents: read
    steps:
      - name: Checkout Code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0 # need the base tip to apply the no-worsening rule

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check memory-file size budget
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║  juniper-deploy - Memory File Size Budget (BLOCKING)       ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          # The base is read from the event rather than hardcoded; merge_group has no
          # github.base_ref, hence the fallback.
          BASE_REF="${{ github.base_ref || 'main' }}"
          git fetch --no-tags origin "$BASE_REF"
          # Allow-Budget-Overrun is a LOAN, not a pass: it suppresses the failure without moving
          # the ceiling, so the debt still blocks the next author. Trailers are injected from an
          # explicit file (the checker never shells out for them) so the classifier stays pure.
          # Two-dot FETCH_HEAD..HEAD = exactly the commits this PR adds on top of base.
          git log --format=%B FETCH_HEAD..HEAD > memory-budget-trailers.txt
          # BLOCKING as of 2026-08-26: `--advisory` (the soak setting) is gone, so a violation exits 1 and
          # fails this check. Escape hatch, when the growth is genuinely warranted: add the commit trailer
          #   Allow-Budget-Overrun: AGENTS.md
          # and carry it into the SQUASH message -- squash composes from the commit messages, so
          # a trailer left only in the PR body is silently discarded.
          python3 util/memory_budget_check.py \
            --base-ref FETCH_HEAD \
            --trailers-file memory-budget-trailers.txt

  # ═══════════════════════════════════════════════════════════════════════════
  # Published Image Refs: every pinned Juniper image resolves, multi-arch
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # Container-registry plan D-1 gives juniper-deploy this role explicitly: it is
  # "the natural home for an integration test that pulls the published images --
  # a stronger check than building from ../sibling paths".
  #
  # WHAT IT CATCHES. docker-compose.yml names a release ref that was never
  # published, or was published single-arch. Compose reports that as a pull
  # failure at `up` time, on the host that needed it. The single-arch half is a
  # real mechanism, not a hypothetical: publish-image.yml has both arch jobs push
  # BY DIGEST and only the merge job apply tags, precisely because two jobs
  # pushing one tag would race and leave a single-arch image wearing a multi-arch
  # tag -- which then fails only on the host that needs the other arch (a Pi).
  #
  # WHY A MANIFEST QUERY AND NOT `docker pull`. The five images are ~270-312 MB
  # compressed each; pulling all of them on every PR buys nothing the manifest
  # does not already answer, and the arch list IS the thing under test. The
  # packages are public, so no credential is needed.
  #
  # NOT FLAKE-PRONE BY CONSTRUCTION. An anonymous ghcr.io token request was
  # observed timing out once in five on 2026-09-15, so the script retries
  # transients (timeouts, resets, 5xx) with backoff and never retries a 404 --
  # a 404 is the answer this gate exists to report.
  #
  # STANDALONE, and deliberately ABSENT from the Quality Gate `needs:` list, per
  # the same plan correction C9 the Memory Budget job records above: a `needs:`
  # entry makes a skip on a non-PR event fail the gate. Whether this context is
  # REQUIRED is decided in the branch ruleset, never here.
  published-image-refs:
    name: Published Image Refs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PyYAML
        run: python3 -m pip install --disable-pip-version-check "PyYAML>=6.0"

      - name: Verify every pinned Juniper image is published multi-arch
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║  juniper-deploy - Published Image Refs                     ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          # No --expect-count here on purpose: the exact per-service census lives
          # in tests/test_published_image_refs.py (EXPECTED_SITES), so there is
          # one place to update when a service is added. The script's own
          # zero-match guard still refuses a wholesale revert to :latest.
          python3 scripts/verify_published_images.py

  # ═══════════════════════════════════════════════════════════════════════════
  # Quality Gate: All required checks must pass
  # ═══════════════════════════════════════════════════════════════════════════
  required-checks:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [pre-commit, gitleaks, sops-validation, tests, validate-compose, docs, security]
    steps:
      - name: Check Quality Gate Status
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-deploy - Quality Gate Status                 ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Pre-commit:         ${{ needs.pre-commit.result }}"
          echo "Gitleaks:           ${{ needs.gitleaks.result }}"
          echo "SOPS Validation:    ${{ needs.sops-validation.result }}"
          echo "Tests:              ${{ needs.tests.result }}"
          echo "Compose Validation: ${{ needs.validate-compose.result }}"
          echo "Documentation:      ${{ needs.docs.result }}"
          echo "Security Scans:     ${{ needs.security.result }}"
          echo ""

          if [[ "${{ needs.pre-commit.result }}" != "success" ]]; then
            echo "::error::Pre-commit checks failed"
            exit 1
          fi

          if [[ "${{ needs.gitleaks.result }}" != "success" ]]; then
            echo "::error::Gitleaks secret scan failed"
            exit 1
          fi

          if [[ "${{ needs.sops-validation.result }}" != "success" ]]; then
            echo "::error::SOPS validation failed"
            exit 1
          fi

          if [[ "${{ needs.tests.result }}" != "success" ]]; then
            echo "::error::Unit tests failed"
            exit 1
          fi

          if [[ "${{ needs.validate-compose.result }}" != "success" ]]; then
            echo "::error::Compose config validation failed"
            exit 1
          fi

          if [[ "${{ needs.docs.result }}" != "success" ]]; then
            echo "::error::Documentation link validation failed"
            exit 1
          fi

          if [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "::error::Dependency security scan failed"
            exit 1
          fi

          echo "::notice::Quality Gate PASSED"
