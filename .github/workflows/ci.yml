---
#####################################################################################################################################################################################################
# Project:       Juniper
# Application:   juniper-deploy
# File Name:     ci.yml
# Author:        Paul Calnon
#
# Date Created:  2026-04-05
# Last Modified: 2026-04-05
#
# License:       MIT License
# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:
#    GitHub Actions CI pipeline for juniper-deploy.
#    - Pre-commit hooks (shellcheck, yamllint, SOPS env validation)
#    - SOPS encryption structural validation
#    - Docker Compose config validation (all profiles)
#    - Required-checks quality gate
#
#####################################################################################################################################################################################################

name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/**
      - fix/**
      - chore/**
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Pre-commit: Code Quality Checks
  # ═══════════════════════════════════════════════════════════════════════════
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install pre-commit

      - name: Cache pre-commit hooks
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Run pre-commit hooks
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-deploy - Pre-commit Checks                   ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          pre-commit run --all-files --show-diff-on-failure

      - name: Validate SOPS encryption on .enc files
        run: |
          echo "Checking for .enc files that lack SOPS metadata..."
          bash scripts/validate_sops_encryption.sh

  # ═══════════════════════════════════════════════════════════════════════════
  # Gitleaks: Secret Detection (full git history)
  # Mirrors the pattern used by juniper-cascor / juniper-data /
  # juniper-canopy / juniper-ml. The .gitleaks.toml allowlist already
  # exempts age public keys and SOPS ciphertext envelopes.
  # ═══════════════════════════════════════════════════════════════════════════
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      # gitleaks-action v2.3.9 has no `fail` input (passing it triggers
      # "Unexpected input(s) 'fail'" in CI). The action exits non-zero
      # on leaks by default, which is the behavior we want.
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action v2.3.9 ships as a Node.js 20 action.
          # GitHub forces Node 24 on 2026-06-02; opt in now to eliminate
          # the deprecation warning and ensure continued operation past
          # the cutover. Drop this once gitleaks-action publishes a
          # release pinned to node24 (upstream PR #215).
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

  # ═══════════════════════════════════════════════════════════════════════════
  # SOPS Encryption Validation
  # ═══════════════════════════════════════════════════════════════════════════
  sops-validation:
    name: SOPS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Check for encrypted files
        id: check-enc
        run: |
          ENC_FILES=$(find . -name '*.env.enc' -o -name '*.env.secrets.enc' 2>/dev/null)
          if [ -z "$ENC_FILES" ]; then
            echo "No encrypted files found — skipping validation."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Found encrypted files:"
            echo "$ENC_FILES"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate SOPS metadata structure
        if: steps.check-enc.outputs.skip != 'true'
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-deploy - SOPS Structural Validation          ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          exit_code=0
          for file in $(find . -name '*.env.enc' -o -name '*.env.secrets.enc'); do
            echo "Validating: $file"

            # Check for required SOPS metadata fields
            for key in sops_version sops_lastmodified; do
              if ! grep -q "^${key}=" "$file" 2>/dev/null; then
                echo "  FAIL: Missing SOPS metadata key: ${key}"
                exit_code=1
              fi
            done
            # Check for age recipient (prefix match — supports multiple recipients)
            if ! grep -q "^sops_age__" "$file" 2>/dev/null; then
              echo "  FAIL: Missing SOPS age recipient metadata"
              exit_code=1
            fi

            # Check that all value lines contain SOPS ciphertext
            plaintext=$(grep -v '^#' "$file" | grep -v '^sops_' | grep -v '^$' | grep -cv 'ENC\[AES256_GCM,' 2>/dev/null) || plaintext=0
            if [ "$plaintext" -gt 0 ]; then
              echo "  FAIL: $plaintext line(s) contain non-encrypted values"
              exit_code=1
            else
              echo "  PASS: All values are SOPS-encrypted"
            fi
          done
          exit $exit_code

  # ═══════════════════════════════════════════════════════════════════════════
  # Unit/Integration Tests: pytest tests/
  # require_* fixtures auto-skip live-service tests when Docker isn't running,
  # so this job exercises offline tests (compose config, script regressions,
  # script security, availability fixture wiring) and skips the rest cleanly.
  # ═══════════════════════════════════════════════════════════════════════════
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install -r requirements-test.txt

      - name: Run pytest
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-deploy - Unit Tests                          ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          pytest tests/ -v --tb=short

      # Catches the failure class that broke 3 juniper-X CIs on
      # 2026-05-18: a workflow that invokes ``python|bash <path>`` after
      # the path was renamed or moved. The test discovers this repo
      # root via a ``.github/workflows/`` walk-up (location-agnostic),
      # so the file at util/test_workflow_script_paths.py can be moved
      # around freely. Mirror of juniper-ml#267's per-PR lint, ported
      # to deploy per juniper-ml notes/CI_CLEANUP.md item 3.
      # PyYAML is already installed via requirements-test.txt above.
      - name: Lint .github/workflows/ script paths
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Workflow script-path lint                            ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          python3 -m unittest -v util/test_workflow_script_paths.py

      # Pins AGENTS.md's header bullet block to the canonical six-field
      # schema (Project / Repository / Author / License / Version /
      # Last Updated, in that relative order). Currency of the
      # `**Last Updated**` field is maintained by the
      # `.github/workflows/agents-md-touch-up.yml` workflow (auto-bumps
      # on every PR push). Shipped as the
      # ``juniper-lint-agents-md-header`` console script in
      # ``juniper-ci-tools>=0.4.0`` (juniper-ml#319). Deploy does not
      # yet use the PyPI-shared workflow-paths lint, so this is the
      # first ci-tools install in this workflow.
      - name: Install juniper-ci-tools (agents-md header-schema lint)
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "juniper-ci-tools>=0.4.0,<0.5.0"

      - name: Lint AGENTS.md header schema
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       AGENTS.md header-schema lint                         ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          juniper-lint-agents-md-header

  # ═══════════════════════════════════════════════════════════════════════════
  # Docker Compose: Validate configuration for all profiles
  # ═══════════════════════════════════════════════════════════════════════════
  validate-compose:
    name: Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Create stub build contexts and secrets
        run: |
          # docker compose config needs build context dirs and secret files to exist
          for dir in ../juniper-data ../juniper-cascor ../juniper-canopy; do
            mkdir -p "$dir"
            echo "FROM scratch" > "$dir/Dockerfile"
          done
          mkdir -p secrets
          for f in juniper_data_api_keys.txt juniper_cascor_api_key.txt cascor_sentry_dsn.txt; do
            echo "stub" > "secrets/$f"
          done

      - name: Validate all profiles
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-deploy - Compose Config Validation           ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          exit_code=0
          for profile in full demo dev test observability; do
            echo ""
            echo "--- Profile: ${profile} ---"
            if docker compose --profile "$profile" config --quiet 2>&1; then
              echo "  PASS: ${profile}"
            else
              echo "  FAIL: ${profile}"
              exit_code=1
            fi
          done
          echo ""
          echo "--- Combined: full + observability ---"
          if docker compose --profile full --profile observability config --quiet 2>&1; then
            echo "  PASS: full + observability"
          else
            echo "  FAIL: full + observability"
            exit_code=1
          fi
          exit $exit_code

  # ═══════════════════════════════════════════════════════════════════════════
  # Quality Gate: All required checks must pass
  # ═══════════════════════════════════════════════════════════════════════════
  required-checks:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [pre-commit, gitleaks, sops-validation, tests, validate-compose]
    steps:
      - name: Check Quality Gate Status
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-deploy - Quality Gate Status                 ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Pre-commit:         ${{ needs.pre-commit.result }}"
          echo "Gitleaks:           ${{ needs.gitleaks.result }}"
          echo "SOPS Validation:    ${{ needs.sops-validation.result }}"
          echo "Tests:              ${{ needs.tests.result }}"
          echo "Compose Validation: ${{ needs.validate-compose.result }}"
          echo ""

          if [[ "${{ needs.pre-commit.result }}" != "success" ]]; then
            echo "::error::Pre-commit checks failed"
            exit 1
          fi

          if [[ "${{ needs.gitleaks.result }}" != "success" ]]; then
            echo "::error::Gitleaks secret scan failed"
            exit 1
          fi

          if [[ "${{ needs.sops-validation.result }}" != "success" ]]; then
            echo "::error::SOPS validation failed"
            exit 1
          fi

          if [[ "${{ needs.tests.result }}" != "success" ]]; then
            echo "::error::Unit tests failed"
            exit 1
          fi

          if [[ "${{ needs.validate-compose.result }}" != "success" ]]; then
            echo "::error::Compose config validation failed"
            exit 1
          fi

          echo "::notice::Quality Gate PASSED"
