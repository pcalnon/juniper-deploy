---
#####################################################################################################################################################################################################
# Project:       Juniper
# Application:   juniper-deploy
# File Name:     ci.yml
# Author:        Paul Calnon
#
# Date Created:  2026-04-05
# Last Modified: 2026-04-05
#
# License:       MIT License
# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:
#    GitHub Actions CI pipeline for juniper-deploy.
#    - Pre-commit hooks (shellcheck, yamllint, SOPS env validation)
#    - SOPS encryption structural validation
#    - Docker Compose config validation (all profiles)
#    - Required-checks quality gate
#
#####################################################################################################################################################################################################

name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/**
      - fix/**
      - chore/**
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Pre-commit: Code Quality Checks
  # ═══════════════════════════════════════════════════════════════════════════
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Cache pre-commit hooks
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Run pre-commit hooks
        env:
          SKIP: docker-compose-check
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-deploy - Pre-commit Checks                  ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          pre-commit run --all-files --show-diff-on-failure

      - name: Validate SOPS encryption on .enc files
        run: |
          echo "Checking for .enc files that lack SOPS metadata..."
          bash scripts/validate_sops_encryption.sh

  # ═══════════════════════════════════════════════════════════════════════════
  # SOPS Encryption Validation
  # ═══════════════════════════════════════════════════════════════════════════
  sops-validation:
    name: SOPS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Check for encrypted files
        id: check-enc
        run: |
          ENC_FILES=$(find . -name '*.env.enc' -o -name '*.env.secrets.enc' 2>/dev/null)
          if [ -z "$ENC_FILES" ]; then
            echo "No encrypted files found — skipping validation."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Found encrypted files:"
            echo "$ENC_FILES"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate SOPS metadata structure
        if: steps.check-enc.outputs.skip != 'true'
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-deploy - SOPS Structural Validation         ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          exit_code=0
          for file in $(find . -name '*.env.enc' -o -name '*.env.secrets.enc'); do
            echo "Validating: $file"

            # Check for required SOPS metadata fields
            for key in sops_version sops_lastmodified; do
              if ! grep -q "^${key}=" "$file" 2>/dev/null; then
                echo "  FAIL: Missing SOPS metadata key: ${key}"
                exit_code=1
              fi
            done
            # Check for age recipient (prefix match — supports multiple recipients)
            if ! grep -q "^sops_age__" "$file" 2>/dev/null; then
              echo "  FAIL: Missing SOPS age recipient metadata"
              exit_code=1
            fi

            # Check that all value lines contain SOPS ciphertext
            plaintext=$(grep -v '^#' "$file" | grep -v '^sops_' | grep -v '^$' | grep -cv 'ENC\[AES256_GCM,' 2>/dev/null) || plaintext=0
            if [ "$plaintext" -gt 0 ]; then
              echo "  FAIL: $plaintext line(s) contain non-encrypted values"
              exit_code=1
            else
              echo "  PASS: All values are SOPS-encrypted"
            fi
          done
          exit $exit_code

  # ═══════════════════════════════════════════════════════════════════════════
  # Docker Compose: Validate configuration for all profiles
  # ═══════════════════════════════════════════════════════════════════════════
  validate-compose:
    name: Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Create stub build contexts and secrets
        run: |
          # docker compose config needs build context dirs and secret files to exist
          for dir in ../juniper-data ../juniper-cascor ../juniper-canopy; do
            mkdir -p "$dir"
            echo "FROM scratch" > "$dir/Dockerfile"
          done
          mkdir -p secrets
          for f in juniper_data_api_keys.txt juniper_cascor_api_key.txt cascor_sentry_dsn.txt; do
            echo "stub" > "secrets/$f"
          done

      - name: Validate all profiles
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-deploy - Compose Config Validation          ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          exit_code=0
          for profile in full demo dev test observability; do
            echo ""
            echo "--- Profile: ${profile} ---"
            if docker compose --profile "$profile" config --quiet 2>&1; then
              echo "  PASS: ${profile}"
            else
              echo "  FAIL: ${profile}"
              exit_code=1
            fi
          done
          echo ""
          echo "--- Combined: full + observability ---"
          if docker compose --profile full --profile observability config --quiet 2>&1; then
            echo "  PASS: full + observability"
          else
            echo "  FAIL: full + observability"
            exit_code=1
          fi
          exit $exit_code

  # ═══════════════════════════════════════════════════════════════════════════
  # Quality Gate: All required checks must pass
  # ═══════════════════════════════════════════════════════════════════════════
  required-checks:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [pre-commit, sops-validation, validate-compose]
    steps:
      - name: Check Quality Gate Status
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-deploy - Quality Gate Status                ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Pre-commit:        ${{ needs.pre-commit.result }}"
          echo "SOPS Validation:   ${{ needs.sops-validation.result }}"
          echo "Compose Validation: ${{ needs.validate-compose.result }}"
          echo ""

          if [[ "${{ needs.pre-commit.result }}" != "success" ]]; then
            echo "::error::Pre-commit checks failed"
            exit 1
          fi

          if [[ "${{ needs.sops-validation.result }}" != "success" ]]; then
            echo "::error::SOPS validation failed"
            exit 1
          fi

          if [[ "${{ needs.validate-compose.result }}" != "success" ]]; then
            echo "::error::Compose config validation failed"
            exit 1
          fi

          echo "::notice::Quality Gate PASSED"
