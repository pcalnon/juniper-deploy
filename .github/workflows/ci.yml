---
#####################################################################################################################################################################################################
# Project:       Juniper
# Application:   juniper-deploy
# File Name:     ci.yml
# Author:        Paul Calnon
#
# Date Created:  2026-04-05
# Last Modified: 2026-04-05
#
# License:       MIT License
# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:
#    GitHub Actions CI pipeline for juniper-deploy.
#    - Pre-commit hooks (shellcheck, yamllint, SOPS env validation)
#    - SOPS encryption structural validation
#    - Docker Compose config validation (all profiles)
#    - Required-checks quality gate
#
#####################################################################################################################################################################################################

name: CI Pipeline

on:
  push:
    # Topic-branch globs (feature/**, fix/**) removed 2026-08-13: once a PR is open,
    # `push` and `pull_request` BOTH fire for the same commit, so every job ran twice.
    # The concurrency group is keyed on github.ref, which differs between a branch push
    # (refs/heads/...) and a PR (refs/pull/N/merge), so cancel-in-progress never collapsed
    # the pair. Same fix as juniper-recurrence#108 / juniper-ml#1076 / juniper-canopy#488.
    # `pull_request` covers every commit once a PR exists; workflow_dispatch remains for a
    # branch with no PR open.
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Pre-commit: Code Quality Checks
  # ═══════════════════════════════════════════════════════════════════════════
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install pre-commit

      - name: Cache pre-commit hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Run pre-commit hooks
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-deploy - Pre-commit Checks                   ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          pre-commit run --all-files --show-diff-on-failure

      - name: Validate SOPS encryption on .enc files
        run: |
          echo "Checking for .enc files that lack SOPS metadata..."
          bash scripts/validate_sops_encryption.sh

  # ═══════════════════════════════════════════════════════════════════════════
  # Gitleaks: Secret Detection (full git history)
  # Mirrors the pattern used by juniper-cascor / juniper-data /
  # juniper-canopy / juniper-ml. The .gitleaks.toml allowlist already
  # exempts age public keys and SOPS ciphertext envelopes.
  # ═══════════════════════════════════════════════════════════════════════════
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # gitleaks-action v2.3.9 has no `fail` input (passing it triggers
      # "Unexpected input(s) 'fail'" in CI). The action exits non-zero
      # on leaks by default, which is the behavior we want.
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action v2.3.9 ships as a Node.js 20 action.
          # GitHub forces Node 24 on 2026-06-02; opt in now to eliminate
          # the deprecation warning and ensure continued operation past
          # the cutover. Drop this once gitleaks-action publishes a
          # release pinned to node24 (upstream PR #215).
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

  # ═══════════════════════════════════════════════════════════════════════════
  # SOPS Encryption Validation
  # ═══════════════════════════════════════════════════════════════════════════
  sops-validation:
    name: SOPS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check for encrypted files
        id: check-enc
        run: |
          ENC_FILES=$(find . -name '*.env.enc' -o -name '*.env.secrets.enc' 2>/dev/null)
          if [ -z "$ENC_FILES" ]; then
            echo "No encrypted files found — skipping validation."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Found encrypted files:"
            echo "$ENC_FILES"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate SOPS metadata structure
        if: steps.check-enc.outputs.skip != 'true'
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-deploy - SOPS Structural Validation          ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          exit_code=0
          for file in $(find . -name '*.env.enc' -o -name '*.env.secrets.enc'); do
            echo "Validating: $file"

            # Check for required SOPS metadata fields
            for key in sops_version sops_lastmodified; do
              if ! grep -q "^${key}=" "$file" 2>/dev/null; then
                echo "  FAIL: Missing SOPS metadata key: ${key}"
                exit_code=1
              fi
            done
            # Check for age recipient (prefix match — supports multiple recipients)
            if ! grep -q "^sops_age__" "$file" 2>/dev/null; then
              echo "  FAIL: Missing SOPS age recipient metadata"
              exit_code=1
            fi

            # Check that all value lines contain SOPS ciphertext
            plaintext=$(grep -v '^#' "$file" | grep -v '^sops_' | grep -v '^$' | grep -cv 'ENC\[AES256_GCM,' 2>/dev/null) || plaintext=0
            if [ "$plaintext" -gt 0 ]; then
              echo "  FAIL: $plaintext line(s) contain non-encrypted values"
              exit_code=1
            else
              echo "  PASS: All values are SOPS-encrypted"
            fi
          done
          exit $exit_code

  # ═══════════════════════════════════════════════════════════════════════════
  # Unit/Integration Tests: pytest tests/
  # require_* fixtures auto-skip live-service tests when Docker isn't running,
  # so this job exercises offline tests (compose config, script regressions,
  # script security, availability fixture wiring) and skips the rest cleanly.
  # ═══════════════════════════════════════════════════════════════════════════
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install -r requirements-test.txt

      - name: Run pytest
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-deploy - Unit Tests                          ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          pytest tests/ -v --tb=short

      # Catches the failure class that broke 3 juniper-X CIs on
      # 2026-05-18: a workflow that invokes ``python|bash <path>`` after
      # the path was renamed or moved. The test discovers this repo
      # root via a ``.github/workflows/`` walk-up (location-agnostic),
      # so the file at util/test_workflow_script_paths.py can be moved
      # around freely. Mirror of juniper-ml#267's per-PR lint, ported
      # to deploy per juniper-ml notes/CI_CLEANUP.md item 3.
      # PyYAML is already installed via requirements-test.txt above.
      - name: Lint .github/workflows/ script paths
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Workflow script-path lint                            ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          python3 -m unittest -v util/test_workflow_script_paths.py

      # Pins AGENTS.md's header bullet block to the canonical six-field
      # schema (Project / Repository / Author / License / Version /
      # Last Updated, in that relative order). Currency of the
      # `**Last Updated**` field is maintained by the
      # `.github/workflows/agents-md-touch-up.yml` workflow (auto-bumps
      # on every PR push). Shipped as the
      # ``juniper-lint-agents-md-header`` console script in
      # ``juniper-ci-tools>=0.4.0`` (juniper-ml#319). Deploy does not
      # yet use the PyPI-shared workflow-paths lint, so this is the
      # first ci-tools install in this workflow.
      #
      # Pin healed 2026-08-08 (sequence-safety rollout W2, decision D4): the
      # prior ``<0.7.0`` ceiling excluded the current ci-tools line and would
      # have diverged from the sequence-safety workflows' ``>=0.8.0,<0.9.0``
      # pin. 0.8.0 still ships ``juniper-lint-agents-md-header`` (verified),
      # so this step is unaffected by the widen.
      - name: Install juniper-ci-tools (agents-md header-schema lint)
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "juniper-ci-tools>=0.8.0,<0.9.0"

      - name: Lint AGENTS.md header schema
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       AGENTS.md header-schema lint                         ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          juniper-lint-agents-md-header

  # ═══════════════════════════════════════════════════════════════════════════
  # Docker Compose: Validate configuration for all profiles
  # ═══════════════════════════════════════════════════════════════════════════
  validate-compose:
    name: Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Create stub build contexts and secrets
        run: |
          # docker compose config needs build context dirs and secret files to exist
          for dir in ../juniper-data ../juniper-cascor ../juniper-canopy; do
            mkdir -p "$dir"
            echo "FROM scratch" > "$dir/Dockerfile"
          done
          mkdir -p secrets
          for f in juniper_data_api_keys.txt juniper_cascor_api_key.txt cascor_sentry_dsn.txt; do
            echo "stub" > "secrets/$f"
          done

      - name: Validate all profiles
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-deploy - Compose Config Validation           ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          exit_code=0
          for profile in full demo dev test observability; do
            echo ""
            echo "--- Profile: ${profile} ---"
            if docker compose --profile "$profile" config --quiet 2>&1; then
              echo "  PASS: ${profile}"
            else
              echo "  FAIL: ${profile}"
              exit_code=1
            fi
          done
          echo ""
          echo "--- Combined: full + observability ---"
          if docker compose --profile full --profile observability config --quiet 2>&1; then
            echo "  PASS: full + observability"
          else
            echo "  FAIL: full + observability"
            exit_code=1
          fi
          exit $exit_code

  # ═══════════════════════════════════════════════════════════════════════════
  # Documentation Links: validate every relative markdown link resolves
  # ═══════════════════════════════════════════════════════════════════════════
  # Tier 2 CI hardening (juniper-ml 2026-08-13): juniper-deploy ships ~45 markdown
  # files, including the operator-facing docs/ set, with no link validation at all —
  # while all 8 sibling repos gate on this. Uses the published juniper-doc-tools
  # validator, same as every sibling.
  docs:
    name: Documentation Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install juniper-doc-tools
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "juniper-doc-tools>=0.1.0,<0.2.0"

      - name: Validate Documentation Links
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-deploy - Documentation Link Validation       ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          # --cross-repo skip: the weekly docs-full-check.yml in juniper-ml owns the
          # cross-repo pass; per-PR we only validate links that resolve in-repo.
          juniper-check-doc-links \
            --exclude history \
            --exclude legacy \
            --exclude CHANGELOG.md \
            --cross-repo skip

  # ═══════════════════════════════════════════════════════════════════════════
  # Security: pip-audit for dependency vulnerabilities
  # ═══════════════════════════════════════════════════════════════════════════
  # Tier 2 CI hardening (juniper-ml 2026-08-13): juniper-deploy had no dependency
  # CVE screen. Audits requirements-test.txt — the only dependency manifest in the
  # repo. --strict is intentionally omitted to match the per-PR contract used by the
  # siblings (a skipped dependency must not fail every PR); the hard weekly screen
  # lives in juniper-ml's security-scan.yml.
  security:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run pip-audit
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-deploy - pip-audit Security Scan             ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          python -m pip install --upgrade "pip>=26.1.1"
          pip install pip-audit
          pip-audit --desc on --requirement requirements-test.txt

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Memory Budget (BLOCKING, standalone): P5 port of juniper-ml's size ratchet.
  # Plan: juniper-ml notes/JUNIPER_2026-08-18_JUNIPER-ML_SHARED-SESSION-MEMORY-PLAN.md (§P5);
  # tracking issue juniper-ml#1326. Rendered by juniper-ml's
  # util/ad-hoc/2026-08-25_p5_port_memory_budget.py from figures measured IN THIS REPO on
  # 2026-08-25 -- re-measure, never transcribe.
  #
  # WHY THE RATE AXIS SHIPS FIRST, AND ALONE. juniper-ml's AGENTS.md grew ~20x in six months
  # WHILE UNDER FOUR ACTIVE CI GATES -- every one of them enforced structure or currency and
  # none enforced SIZE; 172 of 200 main-line merges grew it against 14 that shrank it, by 2,628
  # bytes between them. A cut without a ceiling is undone in ~44 days, and a ceiling set AFTER a
  # cut locks in the inflated level. So the ceiling lands first and the cut comes later; this job
  # carries no relocation check yet, because juniper-deploy has not cut anything to check.
  #
  # STANDALONE, and deliberately ABSENT from any Quality Gate `needs:` (plan correction C9). A
  # `needs:` entry is the wrong promotion mechanism: it makes a skip on a non-PR event fail the
  # gate. Promotion happens in the branch RULESET, the same way Sequence Safety was promoted --
  # and only after the soak below -- which ended 2026-08-26: `--advisory` is gone and the three
  # negative controls were re-run against the non-advisory job (plan §P5 step d).
  #
  # BLOCKING as of 2026-08-26 (plan §P5 step d). The job soaked with `--advisory` from the port's merge,
  # and the flag was removed only after three negative controls passed IN THIS REPO against the
  # non-advisory invocation -- clean tree exits 0, growth past the ceiling exits 1, and a waiver
  # trailer exits 0 -- because a blocking gate that cannot fail is worse than none. Whether this
  # context is REQUIRED is decided in the branch ruleset, never here.
  #
  # SLACK, MEASURED HERE. The ceiling was seeded at the exact size on the day the port landed
  # (34,569 chars, zero slack) and raised 2026-08-26 to 36,569 (+2,000) under an Allow-Ceiling-
  # Raise: AGENTS.md trailer. The slack is the largest single AGENTS.md-growing commit re-measured
  # over the 30 days to 2026-08-26 (1,982; median 1,982, 1 grew / 0 shrank, ~66 chars/day),
  # floored at 2,000 because one fleet-wide docs fan-out (2026-08-21) added 1,982 chars to six
  # repos' AGENTS.md at once -- the shape a zero-slack ceiling cannot absorb. Growth past the
  # ceiling now FAILS this check; Allow-Budget-Overrun: AGENTS.md is the loan for a warranted
  # overrun, and a cut is what brings the ceiling back down (hand-edit with slack, never bare
  # --ratchet).
  memory-budget:
    name: Memory Budget
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      contents: read
    steps:
      - name: Checkout Code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0 # need the base tip to apply the no-worsening rule

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check memory-file size budget
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║  juniper-deploy - Memory File Size Budget (BLOCKING)       ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          # The base is read from the event rather than hardcoded; merge_group has no
          # github.base_ref, hence the fallback.
          BASE_REF="${{ github.base_ref || 'main' }}"
          git fetch --no-tags origin "$BASE_REF"
          # Allow-Budget-Overrun is a LOAN, not a pass: it suppresses the failure without moving
          # the ceiling, so the debt still blocks the next author. Trailers are injected from an
          # explicit file (the checker never shells out for them) so the classifier stays pure.
          # Two-dot FETCH_HEAD..HEAD = exactly the commits this PR adds on top of base.
          git log --format=%B FETCH_HEAD..HEAD > memory-budget-trailers.txt
          # BLOCKING as of 2026-08-26: `--advisory` (the soak setting) is gone, so a violation exits 1 and
          # fails this check. Escape hatch, when the growth is genuinely warranted: add the commit trailer
          #   Allow-Budget-Overrun: AGENTS.md
          # and carry it into the SQUASH message -- squash composes from the commit messages, so
          # a trailer left only in the PR body is silently discarded.
          python3 util/memory_budget_check.py \
            --base-ref FETCH_HEAD \
            --trailers-file memory-budget-trailers.txt

  # ═══════════════════════════════════════════════════════════════════════════
  # Quality Gate: All required checks must pass
  # ═══════════════════════════════════════════════════════════════════════════
  required-checks:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [pre-commit, gitleaks, sops-validation, tests, validate-compose, docs, security]
    steps:
      - name: Check Quality Gate Status
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-deploy - Quality Gate Status                 ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Pre-commit:         ${{ needs.pre-commit.result }}"
          echo "Gitleaks:           ${{ needs.gitleaks.result }}"
          echo "SOPS Validation:    ${{ needs.sops-validation.result }}"
          echo "Tests:              ${{ needs.tests.result }}"
          echo "Compose Validation: ${{ needs.validate-compose.result }}"
          echo "Documentation:      ${{ needs.docs.result }}"
          echo "Security Scans:     ${{ needs.security.result }}"
          echo ""

          if [[ "${{ needs.pre-commit.result }}" != "success" ]]; then
            echo "::error::Pre-commit checks failed"
            exit 1
          fi

          if [[ "${{ needs.gitleaks.result }}" != "success" ]]; then
            echo "::error::Gitleaks secret scan failed"
            exit 1
          fi

          if [[ "${{ needs.sops-validation.result }}" != "success" ]]; then
            echo "::error::SOPS validation failed"
            exit 1
          fi

          if [[ "${{ needs.tests.result }}" != "success" ]]; then
            echo "::error::Unit tests failed"
            exit 1
          fi

          if [[ "${{ needs.validate-compose.result }}" != "success" ]]; then
            echo "::error::Compose config validation failed"
            exit 1
          fi

          if [[ "${{ needs.docs.result }}" != "success" ]]; then
            echo "::error::Documentation link validation failed"
            exit 1
          fi

          if [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "::error::Dependency security scan failed"
            exit 1
          fi

          echo "::notice::Quality Gate PASSED"
