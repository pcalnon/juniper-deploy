---
apiVersion: 1

providers:
  - name: "Juniper Dashboards"
    orgId: 1
    folder: "Juniper"
    folderUid: "juniper"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
