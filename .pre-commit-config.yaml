---
# =============================================================================
# Pre-commit Configuration — juniper-deploy
#
# Install: pre-commit install
# Run all: pre-commit run --all-files
# =============================================================================

repos:
  # ═══════════════════════════════════════════════════════════════════════════
  # General file checks
  # ═══════════════════════════════════════════════════════════════════════════
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: (\.env\.enc$|\.env\.secrets\.enc$)
      - id: end-of-file-fixer
        exclude: (\.env\.enc$|\.env\.secrets\.enc$)
      - id: check-yaml
        exclude: ^k8s/helm/.*/templates/
      - id: check-added-large-files
        args: ['--maxkb=500']

  # ═══════════════════════════════════════════════════════════════════════════
  # Shell script linting
  # ═══════════════════════════════════════════════════════════════════════════
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ['--severity=warning']
        files: \.(sh|bash)$

  # ═══════════════════════════════════════════════════════════════════════════
  # YAML linting
  # ═══════════════════════════════════════════════════════════════════════════
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ['--format', 'parsable', '--strict']
        types: [yaml]
        exclude: ^k8s/helm/.*/templates/

  # ═══════════════════════════════════════════════════════════════════════════
  # Markdown Linting - markdownlint
  # Alignment plan Phase 3: brings juniper-deploy in line with the
  # rest of the fleet's markdown linting. Config in
  # .markdownlint.yaml.
  # ═══════════════════════════════════════════════════════════════════════════
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        name: Lint Markdown files
        args:
          - --config=./.markdownlint.yaml
          - --fix
        files: \.(md|markdown)$
        exclude: ^(CHANGELOG\.md|notes/|docs/|history/)

  # ═══════════════════════════════════════════════════════════════════════════
  # Helm chart linting
  # ═══════════════════════════════════════════════════════════════════════════
  - repo: local
    hooks:
      - id: helm-lint
        name: Helm lint
        entry: helm lint k8s/helm/juniper/
        language: system
        files: ^k8s/helm/juniper/
        pass_filenames: false

  # ═══════════════════════════════════════════════════════════════════════════
  # SOPS: Block unencrypted .env files from being committed
  # ═══════════════════════════════════════════════════════════════════════════
  - repo: local
    hooks:
      - id: no-unencrypted-env
        name: SOPS — block unencrypted secrets
        entry: bash util/sops-pre-commit-hook.sh
        language: system
        files: \.env
        types: [file]

  # ═══════════════════════════════════════════════════════════════════════════
  # SOPS: Validate .enc files contain SOPS metadata
  # ═══════════════════════════════════════════════════════════════════════════
  - repo: local
    hooks:
      - id: validate-sops-encryption
        name: Validate SOPS encryption metadata
        entry: bash scripts/validate_sops_encryption.sh
        language: system
        files: '\.enc$'
        types: [file]

# CI configuration (for pre-commit.ci service, if used)
ci:
  autofix_prs: false
  autoupdate_schedule: monthly
