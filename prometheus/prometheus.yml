---
# =============================================================================
# Juniper Deploy — Prometheus Configuration (docker-compose dev/staging)
#
# This file drives the Prometheus instance shipped with the docker-compose
# stack. The k8s production deployment uses ServiceMonitor CRDs under
# ``k8s/helm/juniper/templates/{data,cascor,canopy}-servicemonitor.yaml``
# instead of these scrape_configs. Both surfaces are kept in sync —
# see METRICS-MON R5 entry plan Q4 ("dual scrape surfaces: raw configs
# for compose, ServiceMonitor CRDs for k8s") and R5.2 closure.
#
# Prometheus YAML files do NOT natively support environment variable
# interpolation. The hardcoded values below correspond one-to-one with the
# PROMETHEUS_* / ALERTMANAGER_TARGET variables documented in .env.example.
# Deployment pipelines that need per-environment overrides should template
# this file via envsubst (or equivalent) at deploy time.
#
# Mapping of hardcoded values to .env.example variables:
#
#   global.scrape_interval     -> ${PROMETHEUS_SCRAPE_INTERVAL:-15s}
#   global.evaluation_interval -> ${PROMETHEUS_EVAL_INTERVAL:-15s}
#   global.scrape_timeout      -> ${PROMETHEUS_SCRAPE_TIMEOUT:-10s}
#   alertmanager target        -> ${ALERTMANAGER_TARGET:-alertmanager:9093}
#   juniper-data scrape        -> ${PROMETHEUS_DATA_SCRAPE_INTERVAL:-10s}
#   juniper-cascor scrape      -> ${PROMETHEUS_CASCOR_SCRAPE_INTERVAL:-10s}
#   juniper-canopy scrape      -> ${PROMETHEUS_CANOPY_SCRAPE_INTERVAL:-15s}
#
# The retention window (--storage.tsdb.retention.time) is set on the
# prometheus container's command line in docker-compose.yml; the matching
# env var is ${PROMETHEUS_RETENTION:-30d}.
#
# Auth note (R5 entry plan Q5 / R5.2 closure):
#   juniper-data ships MetricsAuthMiddleware (SEC-16) gating /metrics by
#   a configured IP allowlist. Inside docker-compose the prometheus
#   container's bridge-network IP must be in JUNIPER_DATA_METRICS_TRUSTED_IPS
#   for scrapes to succeed. juniper-cascor and juniper-canopy expose
#   /metrics without an allowlist; their /metrics endpoints are not
#   reachable from outside the compose network in the default topology.
#   Rationale for the per-service split (rather than promoting the
#   middleware to juniper-observability) is documented in
#   notes/METRICS_AUTH_RATIONALE.md.
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    deployment: "docker-compose"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "recording_rules.yml"
  - "alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"
          environment: "docker"

  # juniper-data — gated by MetricsAuthMiddleware (SEC-16). The prometheus
  # container's IP must be present in JUNIPER_DATA_METRICS_TRUSTED_IPS or the
  # scrape will return HTTP 403. See notes/METRICS_AUTH_RATIONALE.md.
  - job_name: "juniper-data"
    metrics_path: "/metrics"
    scheme: "http"
    scrape_interval: 10s
    scrape_timeout: 10s
    honor_labels: false
    static_configs:
      - targets: ["juniper-data:8100"]
        labels:
          service: "juniper-data"
          environment: "docker"

  # juniper-cascor — container port 8200 (host-side mapping is 8201, not
  # used here because Prometheus scrapes inside the compose network).
  - job_name: "juniper-cascor"
    metrics_path: "/metrics"
    scheme: "http"
    scrape_interval: 10s
    scrape_timeout: 10s
    honor_labels: false
    static_configs:
      - targets: ["juniper-cascor:8200"]
        labels:
          service: "juniper-cascor"
          environment: "docker"

  # juniper-recurrence — container port 8210 (host-side mapping is 8211, unused
  # here: Prometheus scrapes inside the compose network). Gated by
  # MetricsAuthMiddleware (SEC-16) — the prometheus container IP must be in
  # JUNIPER_RECURRENCE_METRICS_TRUSTED_IPS or the scrape returns HTTP 403.
  # Metrics are off by default; enable both via .env.observability.
  - job_name: "juniper-recurrence"
    metrics_path: "/metrics"
    scheme: "http"
    scrape_interval: 15s
    scrape_timeout: 10s
    honor_labels: false
    static_configs:
      - targets: ["juniper-recurrence:8210"]
        labels:
          service: "juniper-recurrence"
          environment: "docker"

  - job_name: "juniper-canopy"
    metrics_path: "/metrics"
    scheme: "http"
    scrape_interval: 15s
    scrape_timeout: 10s
    honor_labels: false
    static_configs:
      - targets: ["juniper-canopy:8050"]
        labels:
          service: "juniper-canopy"
          environment: "docker"

  # ─── Host-experiment scrape lane ─────────────────────────────────────────────
  # CLI-launched ON-HOST cascor / recurrence / data runs (loopback-bound, on the
  # experiment port ranges data 8110-8139 / cascor 8230-8259 / recurrence
  # 8260-8289) are scraped through a launcher-owned relay listening on the
  # monitoring-network gateway (see the prometheus service's extra_hosts entry in
  # docker-compose.yml). The experiment launcher writes ONE JSON target file per
  # run into prometheus/targets/ (visible here at /etc/prometheus/targets via the
  # existing ./prometheus mount) and deletes it at teardown. Run identity
  # (run_id / experiment) rides as SCRAPE-SIDE target labels, so cardinality is
  # bounded by concurrent runs and application code never learns a run id (R1.1).
  # Design: juniper-ml notes JUNIPER_2026-07-29 CLI-TEST-VALIDATION-EXPERIMENTATION-PLAN §7;
  # empirical proof of both arms: JUNIPER_2026-07-30 CLI-EXPERIMENTATION-P0-PREFLIGHT-EVIDENCE (P0.10).
  - job_name: "juniper-host-experiments"
    metrics_path: "/metrics"
    scheme: "http"
    scrape_interval: 15s
    scrape_timeout: 10s
    honor_labels: false
    file_sd_configs:
      - files:
          - "/etc/prometheus/targets/*.json"
        refresh_interval: 15s
