global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "recording_rules.yml"
  - "alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "juniper-data"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["juniper-data:8100"]
        labels:
          service: "juniper-data"
          environment: "docker"

  - job_name: "juniper-cascor"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["juniper-cascor:8200"]
        labels:
          service: "juniper-cascor"
          environment: "docker"

  - job_name: "juniper-canopy"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets: ["juniper-canopy:8050"]
        labels:
          service: "juniper-canopy"
          environment: "docker"
