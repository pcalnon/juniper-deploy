{{- if .Values.data.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "juniper.data.fullname" . }}
  labels:
    {{- include "juniper.labels" . | nindent 4 }}
    app.kubernetes.io/component: data
spec:
  type: {{ .Values.data.service.type }}
  ports:
    - port: {{ .Values.data.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "juniper.selectorLabels" (dict "ctx" . "component" "data") | nindent 4 }}
{{- end }}
