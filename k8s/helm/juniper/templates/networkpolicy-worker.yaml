{{- if and .Values.networkPolicies.enabled .Values.worker.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "juniper.worker.fullname" . }}
  labels:
    {{- include "juniper.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  podSelector:
    matchLabels:
      {{- include "juniper.selectorLabels" (dict "ctx" . "component" "worker") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # Workers accept no inbound traffic
  ingress: []
  egress:
    {{- if .Values.cascor.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: cascor
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ .Values.cascor.service.port }}
          protocol: TCP
    {{- end }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
