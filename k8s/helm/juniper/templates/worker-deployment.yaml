{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "juniper.worker.fullname" . }}
  labels:
    {{- include "juniper.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "juniper.selectorLabels" (dict "ctx" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "juniper.labels" . | nindent 8 }}
        {{- include "juniper.selectorLabels" (dict "ctx" . "component" "worker") | nindent 8 }}
      {{- with .Values.worker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "juniper.podSecurityContext" . | nindent 8 }}
      initContainers:
        - name: wait-for-cascor
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until wget -qO- {{ include "juniper.cascor.serviceUrl" . }}/v1/health >/dev/null 2>&1; do
                echo "Waiting for juniper-cascor..."
                sleep 2
              done
          securityContext:
            {{- include "juniper.containerSecurityContext" . | nindent 12 }}
      containers:
        - name: juniper-cascor-worker
          image: {{ include "juniper.image" (dict "image" .Values.worker.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          securityContext:
            {{- include "juniper.containerSecurityContext" . | nindent 12 }}
          env:
            # CFG-06 (juniper-cascor-worker >= 0.4.0): canonical
            # JUNIPER_CASCOR_WORKER_* env-var names. Legacy CASCOR_* names
            # still work via the alias-with-deprecation helper in worker
            # config.py (juniper-config-tools >= 0.1.0).
            - name: JUNIPER_CASCOR_WORKER_SERVER_URL
              value: {{ include "juniper.cascor.wsUrl" . | quote }}
            {{- range $key, $value := .Values.worker.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: JUNIPER_CASCOR_WORKER_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "juniper.secretName" . }}
                  key: cascor_auth_token
                  optional: true
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            {{- if .Values.worker.healthcheck.enabled }}
            # METRICS-MON R1.3 / seed-04: bind the worker's HTTP health
            # server on 0.0.0.0 so kubelet can reach it; default in the
            # worker image is 127.0.0.1 (intentional — keeps the surface
            # closed unless explicitly enabled here).
            - name: JUNIPER_CASCOR_WORKER_HEALTH_BIND
              value: "0.0.0.0"
            - name: JUNIPER_CASCOR_WORKER_HEALTH_PORT
              value: {{ .Values.worker.healthcheck.port | quote }}
            {{- end }}
          {{- if .Values.worker.healthcheck.enabled }}
          # METRICS-MON R1.3 / seed-04: HTTP probes against the worker's
          # in-process health server. Replaces the legacy
          # ``exec: kill -0 1`` probe which could not detect event-loop
          # wedges or stuck reconnect loops. Only valid against worker
          # image >= 0.4.0.
          ports:
            - name: health
              containerPort: {{ .Values.worker.healthcheck.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.worker.healthcheck.liveness.path }}
              port: health
            initialDelaySeconds: {{ .Values.worker.healthcheck.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.worker.healthcheck.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.worker.healthcheck.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.worker.healthcheck.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.worker.healthcheck.readiness.path }}
              port: health
            initialDelaySeconds: {{ .Values.worker.healthcheck.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.worker.healthcheck.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.worker.healthcheck.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.worker.healthcheck.readiness.failureThreshold }}
          {{- else }}
          # Legacy probes — flip ``worker.healthcheck.enabled: true`` once
          # the deployed worker image ships the R1.3 HTTP health server.
          livenessProbe:
            exec:
              command: ["kill", "-0", "1"]
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["kill", "-0", "1"]
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
