{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "juniper.worker.fullname" . }}
  labels:
    {{- include "juniper.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "juniper.selectorLabels" (dict "ctx" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "juniper.labels" . | nindent 8 }}
        {{- include "juniper.selectorLabels" (dict "ctx" . "component" "worker") | nindent 8 }}
      {{- with .Values.worker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "juniper.podSecurityContext" . | nindent 8 }}
      initContainers:
        - name: wait-for-cascor
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until wget -qO- {{ include "juniper.cascor.serviceUrl" . }}/v1/health >/dev/null 2>&1; do
                echo "Waiting for juniper-cascor..."
                sleep 2
              done
          securityContext:
            {{- include "juniper.containerSecurityContext" . | nindent 12 }}
      containers:
        - name: juniper-cascor-worker
          image: {{ include "juniper.image" (dict "image" .Values.worker.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          securityContext:
            {{- include "juniper.containerSecurityContext" . | nindent 12 }}
          env:
            - name: CASCOR_SERVER_URL
              value: {{ include "juniper.cascor.wsUrl" . | quote }}
            {{- range $key, $value := .Values.worker.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: CASCOR_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "juniper.secretName" . }}
                  key: cascor_auth_token
                  optional: true
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          livenessProbe:
            exec:
              command: ["kill", "-0", "1"]
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["kill", "-0", "1"]
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
