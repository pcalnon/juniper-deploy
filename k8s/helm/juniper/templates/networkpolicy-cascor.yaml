{{- if and .Values.networkPolicies.enabled .Values.cascor.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "juniper.cascor.fullname" . }}
  labels:
    {{- include "juniper.labels" . | nindent 4 }}
    app.kubernetes.io/component: cascor
spec:
  podSelector:
    matchLabels:
      {{- include "juniper.selectorLabels" (dict "ctx" . "component" "cascor") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- if .Values.canopy.enabled }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: canopy
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- end }}
        {{- if .Values.worker.enabled }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: worker
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- end }}
        {{- if (index .Values "kube-prometheus-stack" "enabled") }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        {{- end }}
      ports:
        - port: {{ .Values.cascor.service.port }}
          protocol: TCP
  egress:
    {{- if .Values.data.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: data
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ .Values.data.service.port }}
          protocol: TCP
    {{- end }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
