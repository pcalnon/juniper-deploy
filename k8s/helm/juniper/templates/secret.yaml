{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "juniper.secretName" . }}
  labels:
    {{- include "juniper.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | default "" | b64enc | quote }}
  {{- end }}
{{- end }}
