---
#####################################################################################################################################################################################################
# Project:       Juniper
# Application:   juniper-deploy
# File Name:     docker-compose.yml
# Author:        Paul Calnon
#
# Date Created:  2026-02-25
# Last Modified: 2026-03-01
#
# License:       MIT License
# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:
#    Docker Compose configuration for the Juniper full-stack deployment.
#    Supports multiple profiles for different operational modes:
#
#      full  — All real services (production-like)
#      demo  — Real services with auto-configured CasCor training
#      dev   — Real data + cascor, canopy in demo mode (frontend dev)
#
# Usage:
#    docker compose --profile full up -d     # Full production-like stack
#    docker compose --profile demo up -d     # Self-running demo stack
#    docker compose --profile dev up -d      # Development stack
#    docker compose down                     # Stop all services
#    docker compose logs -f                  # Follow logs
#
#####################################################################################################################################################################################################

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # JuniperData — Dataset Generation Service (port 8100)
  # Shared across all profiles: full, demo, dev
  # ═══════════════════════════════════════════════════════════════════════════
  juniper-data:
    profiles: ["full", "demo", "dev"]
    build:
      context: ../juniper-data
      dockerfile: Dockerfile
    image: juniper-data:latest
    container_name: juniper-data
    ports:
      - "127.0.0.1:${JUNIPER_DATA_PORT:-8100}:${JUNIPER_DATA_PORT:-8100}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - data
    environment:
      JUNIPER_DATA_HOST: "${JUNIPER_DATA_HOST:-0.0.0.0}"
      JUNIPER_DATA_PORT: "${JUNIPER_DATA_PORT:-8100}"
      JUNIPER_DATA_LOG_LEVEL: "${JUNIPER_DATA_LOG_LEVEL:-INFO}"
      JUNIPER_DATA_API_KEYS: "${JUNIPER_DATA_API_KEYS:-}"
      JUNIPER_DATA_API_KEYS_FILE: /run/secrets/juniper_data_api_keys
      JUNIPER_DATA_LOG_FORMAT: "${JUNIPER_DATA_LOG_FORMAT:-text}"
      JUNIPER_DATA_SENTRY_DSN: "${JUNIPER_DATA_SENTRY_DSN:-}"
      JUNIPER_DATA_METRICS_ENABLED: "${JUNIPER_DATA_METRICS_ENABLED:-false}"
    secrets:
      - juniper_data_api_keys
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8100/v1/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # JuniperCascor — CasCor Training Service (port 8200)
  # Used in full + dev profiles (standard configuration)
  # ═══════════════════════════════════════════════════════════════════════════
  juniper-cascor:
    profiles: ["full", "dev"]
    build:
      context: ../juniper-cascor
      dockerfile: Dockerfile
    image: juniper-cascor:latest
    container_name: juniper-cascor
    ports:
      # - "127.0.0.1:${CASCOR_PORT:-8200}:${CASCOR_PORT:-8200}"
      - "${CASCOR_HOST_PORT:-8201}:${CASCOR_PORT:-8200}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - data
    environment:
      JUNIPER_DATA_URL: "${JUNIPER_DATA_URL:-http://juniper-data:8100}"
      JUNIPER_CASCOR_HOST: "${CASCOR_HOST:-0.0.0.0}"
      JUNIPER_CASCOR_PORT: "${CASCOR_PORT:-8200}"
      JUNIPER_CASCOR_LOG_LEVEL: "${CASCOR_LOG_LEVEL:-INFO}"
      JUNIPER_CASCOR_API_KEYS: "${JUNIPER_CASCOR_API_KEYS:-}"
      JUNIPER_CASCOR_RATE_LIMIT_ENABLED: "${JUNIPER_CASCOR_RATE_LIMIT_ENABLED:-true}"
      JUNIPER_CASCOR_RATE_LIMIT_REQUESTS_PER_MINUTE: "${JUNIPER_CASCOR_RATE_LIMIT_REQUESTS_PER_MINUTE:-60}"
      JUNIPER_DATA_API_KEY: "${JUNIPER_DATA_API_KEYS:-}"
      JUNIPER_CASCOR_API_KEYS_FILE: /run/secrets/juniper_cascor_api_keys
      JUNIPER_DATA_API_KEY_FILE: /run/secrets/juniper_data_api_keys
      JUNIPER_CASCOR_LOG_FORMAT: "${JUNIPER_CASCOR_LOG_FORMAT:-text}"
      JUNIPER_CASCOR_SENTRY_DSN: "${JUNIPER_CASCOR_SENTRY_DSN:-}"
      JUNIPER_CASCOR_METRICS_ENABLED: "${JUNIPER_CASCOR_METRICS_ENABLED:-false}"
    secrets:
      - juniper_cascor_api_keys
      - juniper_data_api_keys
    depends_on:
      juniper-data:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8200/v1/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 15s
      retries: 5
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # JuniperCascor Demo — Auto-start CasCor training (port 8200)
  # Used in demo profile only. Starts with auto-configured training session.
  # ═══════════════════════════════════════════════════════════════════════════
  juniper-cascor-demo:
    profiles: ["demo"]
    build:
      context: ../juniper-cascor
      dockerfile: Dockerfile
    image: juniper-cascor:latest
    container_name: juniper-cascor-demo
    ports:
      # - "127.0.0.1:${CASCOR_PORT:-8200}:${CASCOR_PORT:-8200}"
      - "${CASCOR_HOST_PORT:-8201}:${CASCOR_PORT:-8200}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - data
    environment:
      JUNIPER_DATA_URL: "http://juniper-data:8100"
      JUNIPER_CASCOR_HOST: "0.0.0.0"
      JUNIPER_CASCOR_PORT: "8200"
      JUNIPER_CASCOR_LOG_LEVEL: "INFO"
      # --- Demo auto-start configuration ---
      JUNIPER_CASCOR_AUTO_START: "true"
      JUNIPER_CASCOR_AUTO_DATASET: "spiral"
      JUNIPER_CASCOR_AUTO_DATASET_PARAMS: '{"n_spirals": 2, "n_points_per_spiral": 200, "noise": 0.15, "seed": 42}'
      JUNIPER_CASCOR_AUTO_NETWORK: '{"input_size": 2, "output_size": 2, "learning_rate": 0.01}'
      JUNIPER_CASCOR_AUTO_TRAIN_EPOCHS: "500"
    depends_on:
      juniper-data:
        condition: service_healthy
      demo-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8200/v1/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 15s
      retries: 5
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # Demo Dataset Seeder — Init container (runs once and exits)
  # Seeds a canonical spiral dataset in JuniperData for demo use.
  # ═══════════════════════════════════════════════════════════════════════════
  demo-seed:
    profiles: ["demo"]
    image: juniper-data:latest
    container_name: juniper-demo-seed
    entrypoint:
      - python
      - -c
      - |
        import urllib.request, json, time, sys
        base = 'http://juniper-data:8100/v1'
        for i in range(30):
            try:
                urllib.request.urlopen(f'{base}/health', timeout=5)
                break
            except Exception:
                time.sleep(2)
        else:
            sys.exit(1)
        params = json.dumps({
            'generator': 'spiral',
            'params': {'n_spirals': 2, 'n_points_per_spiral': 200, 'noise': 0.15, 'seed': 42},
            'persist': True
        }).encode()
        req = urllib.request.Request(f'{base}/datasets', data=params,
            headers={'Content-Type': 'application/json'})
        resp = urllib.request.urlopen(req, timeout=30)
        print(f'Demo dataset created: {json.loads(resp.read())}')
    depends_on:
      juniper-data:
        condition: service_healthy
    restart: "no"

  # ═══════════════════════════════════════════════════════════════════════════
  # juniper-canopy — Monitoring Dashboard (port 8050)
  # Full profile only: connects to real CasCor service
  # ═══════════════════════════════════════════════════════════════════════════
  juniper-canopy:
    profiles: ["full"]
    build:
      context: ../juniper-canopy
      dockerfile: Dockerfile
    image: juniper-canopy:latest
    container_name: juniper-canopy
    ports:
      - "${CANOPY_PORT:-8050}:${CANOPY_PORT:-8050}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - frontend
      - backend
      - data
    environment:
      JUNIPER_CANOPY_JUNIPER_DATA_URL: "${JUNIPER_DATA_URL:-http://juniper-data:8100}"
      JUNIPER_CANOPY_CASCOR_SERVICE_URL: "${CASCOR_SERVICE_URL:-http://juniper-cascor:8200}"
      JUNIPER_CANOPY_SERVER__HOST: "${CANOPY_HOST:-0.0.0.0}"
      JUNIPER_CANOPY_SERVER__PORT: "${CANOPY_PORT:-8050}"
      JUNIPER_CANOPY_RATE_LIMIT_ENABLED: "${CANOPY_RATE_LIMIT_ENABLED:-true}"
      JUNIPER_CANOPY_RATE_LIMIT_REQUESTS_PER_MINUTE: "${CANOPY_RATE_LIMIT_REQUESTS_PER_MINUTE:-60}"
      JUNIPER_CASCOR_API_KEY: "${JUNIPER_CASCOR_API_KEYS:-}"
      CANOPY_API_KEY_FILE: /run/secrets/canopy_api_key
      JUNIPER_CASCOR_API_KEY_FILE: /run/secrets/juniper_cascor_api_keys
      JUNIPER_CANOPY_LOG_FORMAT: "${CANOPY_LOG_FORMAT:-text}"
      JUNIPER_CANOPY_SENTRY_DSN: "${CANOPY_SENTRY_DSN:-}"
      JUNIPER_CANOPY_METRICS_ENABLED: "${CANOPY_METRICS_ENABLED:-false}"
      REDIS_URL: "redis://redis:6379/0"
    secrets:
      - canopy_api_key
      - juniper_cascor_api_keys
    depends_on:
      juniper-data:
        condition: service_healthy
      juniper-cascor:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8050/v1/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # juniper-canopy-demo — Dashboard pointing at demo CasCor (port 8050)
  # Demo profile only: connects to juniper-cascor-demo for live demo
  # ═══════════════════════════════════════════════════════════════════════════
  juniper-canopy-demo:
    profiles: ["demo"]
    build:
      context: ../juniper-canopy
      dockerfile: Dockerfile
    image: juniper-canopy:latest
    container_name: juniper-canopy-demo
    ports:
      - "${CANOPY_PORT:-8050}:${CANOPY_PORT:-8050}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - frontend
      - backend
      - data
    environment:
      JUNIPER_CANOPY_JUNIPER_DATA_URL: "http://juniper-data:8100"
      JUNIPER_CANOPY_CASCOR_SERVICE_URL: "http://juniper-cascor-demo:8200"
      JUNIPER_CANOPY_SERVER__HOST: "0.0.0.0"
      JUNIPER_CANOPY_SERVER__PORT: "8050"
    depends_on:
      juniper-data:
        condition: service_healthy
      juniper-cascor-demo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8050/v1/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # juniper-canopy-dev — Dashboard in demo mode (port 8050)
  # Dev profile only: runs canopy with JUNIPER_CANOPY_DEMO_MODE for frontend dev
  # ═══════════════════════════════════════════════════════════════════════════
  juniper-canopy-dev:
    profiles: ["dev"]
    build:
      context: ../juniper-canopy
      dockerfile: Dockerfile
    image: juniper-canopy:latest
    container_name: juniper-canopy-dev
    ports:
      - "${CANOPY_PORT:-8050}:${CANOPY_PORT:-8050}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - frontend
    environment:
      JUNIPER_CANOPY_DEMO_MODE: "true"
      JUNIPER_CANOPY_JUNIPER_DATA_URL: "http://juniper-data:8100"
      JUNIPER_CANOPY_SERVER__HOST: "0.0.0.0"
      JUNIPER_CANOPY_SERVER__PORT: "8050"
    depends_on:
      juniper-data:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8050/v1/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # Prometheus — Metrics Collection (port 9090)
  # ═══════════════════════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: juniper-prometheus
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - monitoring
      - backend
      - data
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # AlertManager — Alert Routing and Notification (port 9093)
  # ═══════════════════════════════════════════════════════════════════════════
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: juniper-alertmanager
    profiles: ["observability"]
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - monitoring
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # Grafana — Metrics Dashboard (port 3000)
  # ═══════════════════════════════════════════════════════════════════════════
  grafana:
    image: grafana/grafana:12.4.0
    container_name: juniper-grafana
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - monitoring
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/provisioning/dashboards/juniper-overview.json"
    secrets:
      - grafana_admin_password
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # Redis — Cache and Session Store (port 6379)
  # Used by juniper-canopy for optional caching. Available in full profile.
  # ═══════════════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: juniper-redis
    profiles: ["full", "demo"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - backend
    command: ["redis-server", "--maxmemory", "${REDIS_MAX_MEMORY:-100mb}", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # Cassandra — Time-Series and Metrics Store (port 9042)
  # Used by juniper-canopy for optional persistent metrics. Available in full profile.
  # ═══════════════════════════════════════════════════════════════════════════
  cassandra:
    image: cassandra:4.1
    container_name: juniper-cassandra
    profiles: ["full"]
    ports:
      - "127.0.0.1:${CASSANDRA_PORT:-9042}:9042"
    networks:
      - backend
    environment:
      CASSANDRA_CLUSTER_NAME: "JuniperCluster"
      CASSANDRA_DC: "dc1"
      CASSANDRA_RACK: "rack1"
      MAX_HEAP_SIZE: "${CASSANDRA_MAX_HEAP:-512M}"
      HEAP_NEWSIZE: "${CASSANDRA_HEAP_NEW:-128M}"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local' || exit 1"]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 5
    restart: unless-stopped

# ═══════════════════════════════════════════════════════════════════════════
# Networks — Isolated communication channels
# ═══════════════════════════════════════════════════════════════════════════
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  data:
    driver: bridge
    internal: true
  monitoring:
    driver: bridge

# ═══════════════════════════════════════════════════════════════════════════
# Secrets — Docker secrets for sensitive configuration
# Create secret files in ./secrets/ (see secrets.example/ for reference).
# Falls back to environment variables when secret files don't exist.
# ═══════════════════════════════════════════════════════════════════════════
secrets:
  juniper_data_api_keys:
    file: ./secrets/juniper_data_api_keys.txt
  juniper_cascor_api_keys:
    file: ./secrets/juniper_cascor_api_keys.txt
  canopy_api_key:
    file: ./secrets/canopy_api_key.txt
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
