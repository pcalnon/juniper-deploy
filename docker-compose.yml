# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:
#    Docker Compose configuration for the Juniper full-stack deployment.
#    Supports multiple profiles for different operational modes:
#
#      full           — All real services (production-like)
#      demo           — Real services with auto-configured CasCor training
#      dev            — Real data + cascor, canopy in demo mode (frontend dev)
#      test           — Integration test suite (starts services + test-runner)
#      observability  — Prometheus + Grafana monitoring stack
#
# Usage:
#    docker compose --profile full up -d                          # Full production-like stack
#    docker compose --profile demo up -d                          # Self-running demo stack
#    docker compose --profile dev up -d                           # Development stack
#    docker compose --profile test up                             # Run integration tests
#    docker compose --profile full --profile observability up -d  # Full + monitoring
#    docker compose down                                          # Stop all services
#    docker compose logs -f                                       # Follow logs
#
#####################################################################################################################################################################################################

# ═══════════════════════════════════════════════════════════════════════════
# Health check defaults (Compose extension fields)
# These x-* keys are ignored by Docker Compose itself but are referenced via
# YAML anchors so a single source of truth drives every service's healthcheck
# block. The defaults match the previously hardcoded values, and each value
# can be overridden per-service or via .env (see .env.example).
#
# Wave 1 of the hardcoded-values refactor only DEFINES these anchors. Wiring
# them into the actual service healthcheck blocks happens in Wave 4 (task 4.1)
# so this commit is non-behavioral.
# ═══════════════════════════════════════════════════════════════════════════
x-healthcheck-defaults: &healthcheck-defaults
  interval: ${HEALTHCHECK_INTERVAL:-15s}
  timeout: ${HEALTHCHECK_TIMEOUT:-10s}
  retries: ${HEALTHCHECK_RETRIES:-5}
  start_period: ${HEALTHCHECK_START_PERIOD:-10s}

x-healthcheck-cascor: &healthcheck-cascor
  interval: ${HEALTHCHECK_INTERVAL:-15s}
  timeout: ${HEALTHCHECK_TIMEOUT:-10s}
  retries: ${HEALTHCHECK_RETRIES:-5}
  start_period: ${HEALTHCHECK_START_PERIOD_CASCOR:-15s}

x-healthcheck-canopy: &healthcheck-canopy
  interval: ${HEALTHCHECK_INTERVAL:-15s}
  timeout: ${HEALTHCHECK_TIMEOUT:-10s}
  retries: ${HEALTHCHECK_RETRIES:-5}
  start_period: ${HEALTHCHECK_START_PERIOD_CANOPY:-20s}

# juniper-recurrence imports a heavy pure-Python stack (service-core, model-core,
# recurrence-model, data-client, numpy, fastapi) — ~10-15s — before uvicorn binds,
# so it gets a longer start_period than the other HTTP services.
x-healthcheck-recurrence: &healthcheck-recurrence
  interval: ${HEALTHCHECK_INTERVAL:-15s}
  timeout: ${HEALTHCHECK_TIMEOUT:-10s}
  retries: ${HEALTHCHECK_RETRIES:-5}
  start_period: ${HEALTHCHECK_START_PERIOD_RECURRENCE:-40s}

x-healthcheck-worker: &healthcheck-worker
  interval: ${HEALTHCHECK_WORKER_INTERVAL:-30s}
  timeout: ${HEALTHCHECK_WORKER_TIMEOUT:-10s}
  retries: ${HEALTHCHECK_WORKER_RETRIES:-3}
  start_period: ${HEALTHCHECK_WORKER_START_PERIOD:-15s}

x-healthcheck-redis: &healthcheck-redis
  interval: ${HEALTHCHECK_REDIS_INTERVAL:-10s}
  timeout: ${HEALTHCHECK_REDIS_TIMEOUT:-5s}
  retries: ${HEALTHCHECK_REDIS_RETRIES:-5}
  start_period: ${HEALTHCHECK_REDIS_START_PERIOD:-5s}

# ═══════════════════════════════════════════════════════════════════════════
# Resource limit defaults (DEPLOY-07)
# Compose v2 honors `deploy.resources.limits` via cgroups. Three tiers cover
# the workload mix: training-heavy (cascor + worker), service-light (data /
# canopy / prometheus / grafana), and tiny (alertmanager / redis). Defaults
# err on the generous side so existing dev workflows aren't OOM-killed; bump
# the corresponding RESOURCES_* env vars down to enforce tighter limits.
# ═══════════════════════════════════════════════════════════════════════════
x-resources-heavy: &resources-heavy
  resources:
    limits:
      cpus: "${RESOURCES_HEAVY_CPUS:-4.0}"
      memory: ${RESOURCES_HEAVY_MEMORY:-8G}
    reservations:
      cpus: "${RESOURCES_HEAVY_CPUS_RESERVATION:-1.0}"
      memory: ${RESOURCES_HEAVY_MEMORY_RESERVATION:-2G}

x-resources-light: &resources-light
  resources:
    limits:
      cpus: "${RESOURCES_LIGHT_CPUS:-1.0}"
      memory: ${RESOURCES_LIGHT_MEMORY:-2G}
    reservations:
      cpus: "${RESOURCES_LIGHT_CPUS_RESERVATION:-0.25}"
      memory: ${RESOURCES_LIGHT_MEMORY_RESERVATION:-256M}

x-resources-tiny: &resources-tiny
  resources:
    limits:
      cpus: "${RESOURCES_TINY_CPUS:-0.5}"
      memory: ${RESOURCES_TINY_MEMORY:-256M}
    reservations:
      cpus: "${RESOURCES_TINY_CPUS_RESERVATION:-0.1}"
      memory: ${RESOURCES_TINY_MEMORY_RESERVATION:-64M}

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # JuniperData — Dataset Generation Service (port 8100)
  # Shared across all profiles: full, demo, dev, test
  # ═══════════════════════════════════════════════════════════════════════════
  juniper-data:
    profiles: ["full", "demo", "dev", "test"]
    build:
      context: ../juniper-data
      dockerfile: Dockerfile
      args:
        GIT_SHA: "${GIT_SHA_DATA:-}"
        BUILD_DATE: "${BUILD_DATE:-}"
        APP_VERSION: "${APP_VERSION_DATA:-}"
    image: juniper-data:latest
    container_name: juniper-data
    # No host port is published: juniper-data is attached only to the `backend`
    # and `data` networks, both `internal: true`. Docker cannot publish a host
    # port from an internal-only network, so a `ports:` mapping here would be
    # silently ineffective (visible in `docker inspect` but never bound/listening).
    # Other services reach data over the Docker network (http://juniper-data:8100);
    # scripts/{health_check,wait_for_services}.sh probe it via `docker compose exec`.
    # To expose data on the host, also attach it to the non-internal `frontend`
    # network and restore a `ports:` mapping.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      JUNIPER_DATA_HOST: "${JUNIPER_DATA_HOST:-0.0.0.0}"
      JUNIPER_DATA_PORT: "${JUNIPER_DATA_PORT:-8100}"
      JUNIPER_DATA_LOG_LEVEL: "${JUNIPER_DATA_LOG_LEVEL:-INFO}"
      # DEPLOY-11: API keys are read exclusively from the Docker secret file.
      # The plain `${JUNIPER_DATA_API_KEYS:-}` env var was removed because its
      # empty default silently disabled auth when the operator didn't set it.
      # The secret file is non-empty by default (placeholder in
      # secrets.example/juniper_data_api_keys.txt) so auth is on out of the box.
      JUNIPER_DATA_API_KEYS_FILE: /run/secrets/juniper_data_api_keys
      JUNIPER_DATA_LOG_FORMAT: "${JUNIPER_DATA_LOG_FORMAT:-text}"
      JUNIPER_DATA_SENTRY_DSN: "${JUNIPER_DATA_SENTRY_DSN:-}"
      JUNIPER_DATA_METRICS_ENABLED: "${JUNIPER_DATA_METRICS_ENABLED:-false}"
      # SEC-16: IP allowlist for /metrics. JSON list of IP literals or CIDR
      # ranges. Defaults to loopback only. See notes/METRICS_AUTH_RATIONALE.md.
      JUNIPER_DATA_METRICS_TRUSTED_IPS: "${JUNIPER_DATA_METRICS_TRUSTED_IPS:-[\"127.0.0.1\",\"::1\"]}"
    volumes:
      - juniper-data-datasets:/app/data/datasets
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/v1/health', timeout=5)"]
      <<: *healthcheck-defaults
    secrets:
      - juniper_data_api_keys
    networks:
      - backend
      - data
    deploy:
      <<: *resources-light
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # JuniperCascor — CasCor Training Service (port 8200)
  # Used in full + dev profiles (standard configuration)
  # ═══════════════════════════════════════════════════════════════════════════
  juniper-cascor:
    profiles: ["full", "dev", "test"]
    build:
      context: ../juniper-cascor
      dockerfile: Dockerfile
      args:
        GIT_SHA: "${GIT_SHA_CASCOR:-}"
        BUILD_DATE: "${BUILD_DATE:-}"
        APP_VERSION: "${APP_VERSION_CASCOR:-}"
    image: juniper-cascor:latest
    container_name: juniper-cascor
    ports:
      - "${BIND_HOST:-127.0.0.1}:${CASCOR_HOST_PORT:-8201}:${CASCOR_PORT:-8200}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      JUNIPER_DATA_URL: "${JUNIPER_DATA_URL:-http://juniper-data:8100}"
      JUNIPER_CASCOR_HOST: "${CASCOR_HOST:-0.0.0.0}"
      JUNIPER_CASCOR_PORT: "${CASCOR_PORT:-8200}"
      JUNIPER_CASCOR_LOG_LEVEL: "${CASCOR_LOG_LEVEL:-INFO}"
      JUNIPER_CASCOR_RATE_LIMIT_ENABLED: "${JUNIPER_CASCOR_RATE_LIMIT_ENABLED:-true}"
      JUNIPER_CASCOR_RATE_LIMIT_REQUESTS_PER_MINUTE: "${JUNIPER_CASCOR_RATE_LIMIT_REQUESTS_PER_MINUTE:-60}"
      # DEPLOY-11: API keys are read from secret files only. The plain
      # JUNIPER_CASCOR_API_KEYS / JUNIPER_DATA_API_KEY env vars were removed.
      JUNIPER_CASCOR_API_KEYS_FILE: /run/secrets/juniper_cascor_api_keys
      JUNIPER_DATA_API_KEY_FILE: /run/secrets/juniper_data_api_keys
      JUNIPER_CASCOR_LOG_FORMAT: "${JUNIPER_CASCOR_LOG_FORMAT:-text}"
      JUNIPER_CASCOR_SENTRY_DSN: "${JUNIPER_CASCOR_SENTRY_DSN:-}"
      JUNIPER_CASCOR_METRICS_ENABLED: "${JUNIPER_CASCOR_METRICS_ENABLED:-false}"
      # SEC-16 parity with juniper-data (juniper-cascor #313): IP allowlist
      # for the Prometheus ``/metrics`` mount. JSON list of IP literals or
      # CIDR ranges. Defaults to loopback only; override via
      # ``JUNIPER_CASCOR_METRICS_TRUSTED_IPS`` (e.g., set in
      # ``.env.observability`` to include the Docker bridge subnets so
      # ``make monitor`` brings Prometheus's juniper-cascor target ``up``
      # out of the box). See notes/poc/POC_REMEDIATION_PLAN_2026-05-27.md
      # §3.1.
      JUNIPER_CASCOR_METRICS_TRUSTED_IPS: "${JUNIPER_CASCOR_METRICS_TRUSTED_IPS:-[\"127.0.0.1\",\"::1\"]}"
      # E.2 PR-2-D: /ws/control Origin allowlist (juniper-cascor#312).
      # The default cascor allowlist only includes localhost:8050; inside
      # docker compose canopy connects from `http://juniper-canopy:8050`,
      # so without this override every /ws/control upgrade is
      # 403-rejected with `Control WS: no Origin header — rejecting`
      # (the Python `websockets` library auto-emits no Origin for
      # non-browser callers, so juniper-cascor-client>=0.5.0 forwards
      # the explicit Origin we configure on canopy's side via
      # `JUNIPER_CANOPY_CASCOR_WS_ORIGIN` below).  Comma-CSV form is
      # parsed by juniper-cascor#312's `_parse_ws_control_allowed_origins`
      # validator. See juniper-ml
      # notes/STACK_REGRESSION_CORRECTIONS_2026-05-27.md §E.2.
      JUNIPER_CASCOR_WS_CONTROL_ALLOWED_ORIGINS: "${JUNIPER_CASCOR_WS_CONTROL_ALLOWED_ORIGINS:-http://juniper-canopy:8050,http://localhost:8050,http://127.0.0.1:8050}"
    volumes:
      - juniper-cascor-snapshots:/app/data
      - juniper-cascor-logs:/app/logs
    secrets:
      # `juniper_cascor_api_keys` (plural) is cascor's accept-list of API keys —
      # JUNIPER_CASCOR_API_KEYS_FILE above reads this; worker → cascor WS auth
      # silently failed for ~16 days because this mount was missing and the env
      # var pointed at a path that didn't exist in the container. The singular
      # `juniper_cascor_api_key` remains because canopy reads a single key from
      # the same secret name on its side of the wire.
      - juniper_cascor_api_keys
      - juniper_cascor_api_key
      # `juniper_data_api_keys` is cascor's OUTBOUND key when calling
      # juniper-data — JUNIPER_DATA_API_KEY_FILE above reads from
      # `/run/secrets/juniper_data_api_keys`. Same mount-not-declared
      # mistake as the `juniper_cascor_api_keys` line above (PR #87): the
      # env var was set but the secret wasn't mounted, so cascor->data
      # calls silently sent no X-API-Key. Surfaces only when juniper-data
      # has auth enabled (populated `juniper_data_api_keys.txt`); pre-this-PR
      # the placeholder file was empty so juniper-data auth was disabled
      # and the missing mount was inert.
      - juniper_data_api_keys
      - cascor_sentry_dsn
    depends_on:
      juniper-data:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/v1/health', timeout=5)"]
      <<: *healthcheck-cascor
    networks:
      - backend
      - data
      - frontend
    deploy:
      <<: *resources-heavy
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # JuniperCascorWorker — Distributed Training Worker (no exposed port)
  # WebSocket client that connects to JuniperCascor for remote training tasks.
  # Used in full + test profiles. Scales via deploy.replicas.
  # ═══════════════════════════════════════════════════════════════════════════
  juniper-cascor-worker:
    profiles: ["full", "test"]
    build:
      context: ../juniper-cascor-worker
      dockerfile: Dockerfile
      args:
        GIT_SHA: "${GIT_SHA_WORKER:-}"
        BUILD_DATE: "${BUILD_DATE:-}"
        APP_VERSION: "${APP_VERSION_WORKER:-}"
    image: juniper-cascor-worker:latest
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # CFG-06 (juniper-cascor-worker >= 0.4.0): canonical
      # JUNIPER_CASCOR_WORKER_* env-var names. Legacy CASCOR_* names
      # still work (with a DeprecationWarning) — operators using the
      # ``CASCOR_WORKER_SERVER_URL`` / ``CASCOR_WORKER_HEARTBEAT_INTERVAL``
      # host-side overrides keep them, only the container-side names
      # update here. AUTH_TOKEN_FILE is intentionally left alone in
      # this PR — the secret-file handling path needs a separate
      # verification before renaming.
      JUNIPER_CASCOR_WORKER_SERVER_URL: "${CASCOR_WORKER_SERVER_URL:-ws://juniper-cascor:8200/ws/v1/workers}"
      JUNIPER_CASCOR_WORKER_HEARTBEAT_INTERVAL: "${CASCOR_WORKER_HEARTBEAT_INTERVAL:-10.0}"
      # DEPLOY-09: Auth token is read exclusively from the Docker secret file
      # mounted at /run/secrets/cascor_auth_token. The plain CASCOR_AUTH_TOKEN
      # env var was removed to keep the secret out of `docker inspect`, env
      # dumps, and accidentally-committed `.env` files.
      CASCOR_AUTH_TOKEN_FILE: /run/secrets/cascor_auth_token
    secrets:
      - cascor_auth_token
    depends_on:
      juniper-cascor:
        condition: service_healthy
    # The legacy `kill -0 1` healthcheck only proved that PID 1 had not crashed.
    # It hid 16 days of silent worker → cascor WebSocket failure: workers stayed
    # `(healthy)` in `docker ps` while their WS connection retried fruitlessly.
    # Probing the worker's own /v1/health/ready endpoint (METRICS-MON R1.3 /
    # seed-04) flips the container to `(unhealthy)` the moment _connection is
    # not bound or the registration handshake hasn't completed — exactly the
    # state we want surfaced.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8210/v1/health/ready', timeout=5)"]
      <<: *healthcheck-worker
    networks:
      - backend
    deploy:
      <<: *resources-heavy
      replicas: ${WORKER_REPLICAS:-2}
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # JuniperCascor Demo — Auto-start CasCor training (port 8200)
  # Used in demo profile only. Starts with auto-configured training session.
  # ═══════════════════════════════════════════════════════════════════════════
  juniper-cascor-demo:
    profiles: ["demo"]
    build:
      context: ../juniper-cascor
      dockerfile: Dockerfile
      args:
        GIT_SHA: "${GIT_SHA_CASCOR:-}"
        BUILD_DATE: "${BUILD_DATE:-}"
        APP_VERSION: "${APP_VERSION_CASCOR:-}"
    image: juniper-cascor:latest
    container_name: juniper-cascor-demo
    ports:
      - "${BIND_HOST:-127.0.0.1}:${CASCOR_HOST_PORT:-8201}:${CASCOR_PORT:-8200}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      JUNIPER_DATA_URL: "http://juniper-data:8100"
      JUNIPER_CASCOR_HOST: "0.0.0.0"
      JUNIPER_CASCOR_PORT: "8200"
      JUNIPER_CASCOR_LOG_LEVEL: "INFO"
      # DEPLOY-10: rate-limiting on by default even in demo profiles. Auth
      # remains intentionally disabled here so the demo is open-by-design,
      # but unbounded request rates would still let a single client knock
      # the demo over.
      JUNIPER_CASCOR_RATE_LIMIT_ENABLED: "${JUNIPER_CASCOR_RATE_LIMIT_ENABLED:-true}"
      JUNIPER_CASCOR_RATE_LIMIT_REQUESTS_PER_MINUTE: "${JUNIPER_CASCOR_RATE_LIMIT_REQUESTS_PER_MINUTE:-60}"
      # ``make obs-demo`` loads ``.env.observability`` which sets
      # ``JUNIPER_CASCOR_METRICS_ENABLED=true``; default off-out-of-the-box
      # matches the canonical ``juniper-cascor`` service so the demo
      # service has no /metrics endpoint when run without the observability
      # profile.
      JUNIPER_CASCOR_METRICS_ENABLED: "${JUNIPER_CASCOR_METRICS_ENABLED:-false}"
      # SEC-16 / POC §6: ``MetricsAuthMiddleware`` gates ``/metrics`` by IP
      # allowlist. ``make obs-demo`` loads ``.env.observability`` which
      # widens the default loopback-only allowlist to cover the compose
      # bridge subnets so prometheus can scrape this container. Same
      # mechanism as the canonical ``juniper-cascor`` service above.
      JUNIPER_CASCOR_METRICS_TRUSTED_IPS: "${JUNIPER_CASCOR_METRICS_TRUSTED_IPS:-[\"127.0.0.1\",\"::1\"]}"
      # /ws/control Origin allowlist — demo-flavoured. The default in
      # cascor's settings is loopback-only, and the canonical
      # ``juniper-cascor`` service overrides to add
      # ``http://juniper-canopy:8050``. Under the demo profile canopy
      # runs as ``juniper-canopy-demo:8050`` and sends Origin
      # ``http://juniper-canopy-demo:8050`` (set via
      # ``JUNIPER_CANOPY_CASCOR_WS_ORIGIN`` on the canopy-demo service);
      # without this allowlist entry every /ws/control upgrade is
      # 403-rejected, breaking canopy↔cascor live control under the
      # demo profile.
      JUNIPER_CASCOR_WS_CONTROL_ALLOWED_ORIGINS: "${JUNIPER_CASCOR_WS_CONTROL_ALLOWED_ORIGINS:-http://juniper-canopy-demo:8050,http://localhost:8050,http://127.0.0.1:8050}"
      # --- Demo auto-start configuration ---
      JUNIPER_CASCOR_AUTO_START: "true"
      JUNIPER_CASCOR_AUTO_DATASET: "spiral"
      JUNIPER_CASCOR_AUTO_DATASET_PARAMS: '{"n_spirals": 2, "n_points_per_spiral": 200, "noise": 0.15, "seed": 42}'
      JUNIPER_CASCOR_AUTO_NETWORK: '{"input_size": 2, "output_size": 2, "learning_rate": 0.01}'
      JUNIPER_CASCOR_AUTO_TRAIN_EPOCHS: "500"
      # Outbound key for cascor's juniper-data-client. Auto-start POSTs
      # /v1/datasets to juniper-data, which since DEPLOY-09 hardening
      # requires X-API-Key — without this the spiral-dataset creation
      # 401s and the demo never starts training. Same secret juniper-data
      # uses to validate incoming X-API-Key headers (single source of
      # truth), matching the canonical ``juniper-cascor`` service wiring.
      JUNIPER_DATA_API_KEY_FILE: /run/secrets/juniper_data_api_keys
    volumes:
      - juniper-cascor-snapshots:/app/data
      - juniper-cascor-logs:/app/logs
    secrets:
      # Outbound juniper-data key for the cascor-demo auto-start flow.
      # See JUNIPER_DATA_API_KEY_FILE comment above.
      - juniper_data_api_keys
    depends_on:
      juniper-data:
        condition: service_healthy
      demo-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8200/v1/health', timeout=5)"]
      <<: *healthcheck-cascor
    networks:
      - backend
      - data
      - frontend
    deploy:
      <<: *resources-heavy
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # Demo Dataset Seeder — Init container (runs once and exits)
  # Seeds a canonical spiral dataset in JuniperData for demo use.
  # ═══════════════════════════════════════════════════════════════════════════
  demo-seed:
    profiles: ["demo"]
    image: juniper-data:latest
    container_name: juniper-demo-seed
    entrypoint:
      - python
      - -c
      - |
        import urllib.request, json, time, sys, pathlib
        base = 'http://juniper-data:8100/v1'
        # juniper-data ships with auth enabled (populated juniper_data_api_keys.txt
        # — DEPLOY-09 hardening). Read the first key from the mounted Docker
        # secret and send it as X-API-Key. Empty file → unauth call (back-compat
        # for the pre-DEPLOY-09 setup where auth was off).
        key_path = pathlib.Path('/run/secrets/juniper_data_api_keys')
        api_key = ''
        if key_path.exists():
            for line in key_path.read_text().splitlines():
                line = line.strip()
                if line and not line.startswith('#'):
                    api_key = line.split(',', 1)[0].strip()
                    break
        headers = {'Content-Type': 'application/json'}
        if api_key:
            headers['X-API-Key'] = api_key
        for i in range(30):
            try:
                urllib.request.urlopen(f'{base}/health', timeout=5)
                break
            except Exception:
                time.sleep(2)
        else:
            sys.exit(1)
        params = json.dumps({
            'generator': 'spiral',
            'params': {'n_spirals': 2, 'n_points_per_spiral': 200, 'noise': 0.15, 'seed': 42},
            'persist': True
        }).encode()
        req = urllib.request.Request(f'{base}/datasets', data=params, headers=headers)
        resp = urllib.request.urlopen(req, timeout=30)
        print(f'Demo dataset created: {json.loads(resp.read())}')
    depends_on:
      juniper-data:
        condition: service_healthy
    # Mount juniper-data's API-keys file so demo-seed can authenticate to the
    # protected POST /v1/datasets endpoint. Same secret juniper-data uses to
    # validate incoming X-API-Key headers, so a single source of truth covers
    # both ends. Mount-only (no env var) — the entrypoint reads the path
    # directly.
    secrets:
      - juniper_data_api_keys
    networks:
      - backend
    restart: "no"

  # ═══════════════════════════════════════════════════════════════════════════
  # JuniperRecurrence — Δt-native LMU recurrence service (container port 8210)
  # Host 8211 -> container 8210 (OQ-15/G7). A shared backend service like
  # juniper-data: it runs under every profile (no -demo rename needed) so both
  # prometheus.yml and prometheus.demo.yml scrape the same `juniper-recurrence`
  # target. numpy-only (no torch), so it gets the resources-light tier.
  # ═══════════════════════════════════════════════════════════════════════════
  juniper-recurrence:
    profiles: ["full", "demo", "dev", "test"]
    build:
      context: ../juniper-recurrence/juniper-recurrence
      dockerfile: Dockerfile
      args:
        GIT_SHA: "${GIT_SHA_RECURRENCE:-}"
        BUILD_DATE: "${BUILD_DATE:-}"
        APP_VERSION: "${APP_VERSION_RECURRENCE:-}"
    image: juniper-recurrence:latest
    container_name: juniper-recurrence
    ports:
      - "${BIND_HOST:-127.0.0.1}:${RECURRENCE_HOST_PORT:-8211}:${RECURRENCE_PORT:-8210}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      JUNIPER_RECURRENCE_HOST: "${RECURRENCE_HOST:-0.0.0.0}"
      JUNIPER_RECURRENCE_PORT: "${RECURRENCE_PORT:-8210}"
      JUNIPER_RECURRENCE_LOG_LEVEL: "${RECURRENCE_LOG_LEVEL:-INFO}"
      # The LMU /train + /crossval paths fetch datasets from juniper-data.
      JUNIPER_DATA_URL: "${JUNIPER_DATA_URL:-http://juniper-data:8100}"
      # Outbound juniper-data API key — the shared cross-service secret
      # (same convention cascor / canopy use via the *_FILE indirection).
      JUNIPER_DATA_API_KEY_FILE: /run/secrets/juniper_data_api_keys
      JUNIPER_RECURRENCE_RATE_LIMIT_ENABLED: "${JUNIPER_RECURRENCE_RATE_LIMIT_ENABLED:-true}"
      # Metrics off by default (parity with data / cascor); enable + extend the
      # trusted-IPs allowlist with the compose-network CIDR via .env.observability
      # so `make monitor` brings the prometheus juniper-recurrence target up.
      JUNIPER_RECURRENCE_METRICS_ENABLED: "${JUNIPER_RECURRENCE_METRICS_ENABLED:-false}"
      # SEC-16 parity: IP allowlist for /metrics. JSON list of IP literals / CIDRs.
      JUNIPER_RECURRENCE_METRICS_TRUSTED_IPS: "${JUNIPER_RECURRENCE_METRICS_TRUSTED_IPS:-[\"127.0.0.1\",\"::1\"]}"
      # Inbound API-key auth is opt-in (the app allows open access when no keys are
      # configured; the host port binds to 127.0.0.1 via BIND_HOST by default). To
      # enable it, add a `juniper_recurrence_api_keys` secret (top-level + below) and
      # set JUNIPER_RECURRENCE_API_KEYS_FILE=/run/secrets/juniper_recurrence_api_keys.
    secrets:
      - juniper_data_api_keys
    depends_on:
      juniper-data:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8210/v1/health', timeout=5)"]
      <<: *healthcheck-recurrence
    networks:
      - backend
      - data
      - frontend
    deploy:
      <<: *resources-light
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # juniper-canopy — Monitoring Dashboard (port 8050)
  # Full profile only: connects to real CasCor service
  # ═══════════════════════════════════════════════════════════════════════════
  juniper-canopy:
    profiles: ["full", "test"]
    build:
      context: ../juniper-canopy
      dockerfile: Dockerfile
      args:
        GIT_SHA: "${GIT_SHA_CANOPY:-}"
        BUILD_DATE: "${BUILD_DATE:-}"
        APP_VERSION: "${APP_VERSION_CANOPY:-}"
    image: juniper-canopy:latest
    container_name: juniper-canopy
    ports:
      - "${BIND_HOST:-127.0.0.1}:${CANOPY_PORT:-8050}:${CANOPY_PORT:-8050}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      JUNIPER_CANOPY_JUNIPER_DATA_URL: "${JUNIPER_DATA_URL:-http://juniper-data:8100}"
      JUNIPER_CANOPY_CASCOR_SERVICE_URL: "${CASCOR_SERVICE_URL:-http://juniper-cascor:8200}"
      # A1-iv: outbound URL the dashboard uses to reach the juniper-recurrence (LMU)
      # one-shot model service in-stack. canopy resolves it via
      # Settings.recurrence_service_url (juniper-canopy A1-i): the prefixed
      # JUNIPER_CANOPY_RECURRENCE_SERVICE_URL wins over the shared RECURRENCE_SERVICE_URL.
      JUNIPER_CANOPY_RECURRENCE_SERVICE_URL: "${RECURRENCE_SERVICE_URL:-http://juniper-recurrence:8210}"
      JUNIPER_CANOPY_SERVER__HOST: "${CANOPY_HOST:-0.0.0.0}"
      JUNIPER_CANOPY_SERVER__PORT: "${CANOPY_PORT:-8050}"
      JUNIPER_CANOPY_RATE_LIMIT_ENABLED: "${CANOPY_RATE_LIMIT_ENABLED:-true}"
      JUNIPER_CANOPY_RATE_LIMIT_REQUESTS_PER_MINUTE: "${CANOPY_RATE_LIMIT_REQUESTS_PER_MINUTE:-60}"
      # DEPLOY-11: API keys read from secret files only. JUNIPER_CASCOR_API_KEY
      # plain env var removed.
      CANOPY_API_KEY_FILE: /run/secrets/canopy_api_key
      JUNIPER_CASCOR_API_KEY_FILE: /run/secrets/juniper_cascor_api_keys
      # Outbound X-API-Key canopy sends on every juniper-data request.
      # juniper-canopy 0.5.1 ``Settings.juniper_data_api_key`` field
      # validator reads this via the canopy-side `secrets_util.get_secret`
      # helper (`_FILE`-suffix indirection). Before juniper-canopy#329
      # the canopy code never sent an outbound juniper-data key, which
      # silently 401'd every canopy → juniper-data call once
      # juniper-deploy#100 enabled juniper-data auth — canopy's own
      # ``/v1/health`` continued to report ``juniper_data_available:
      # true`` because data's ``/v1/health`` is auth-exempt, so the
      # failure was invisible at the dashboard layer.
      JUNIPER_CANOPY_JUNIPER_DATA_API_KEY_FILE: /run/secrets/juniper_data_api_keys
      # E.2 PR-2-D: Origin header for canopy → cascor /ws/control
      # upgrade (juniper-canopy#328 / juniper-cascor-client>=0.5.0).
      # The canopy Settings default is already
      # `http://juniper-canopy:8050` — declaring it here makes the
      # contract explicit in compose so future env-rewrites cannot
      # silently drop it.  Pair with
      # `JUNIPER_CASCOR_WS_CONTROL_ALLOWED_ORIGINS` on cascor above.
      # Restored after being dropped from this production block during
      # the #103 `_FILE`-env restructure; the juniper-canopy-demo service
      # kept its own variant (default `http://juniper-canopy-demo:8050`),
      # which masked the loss behind a single file-wide occurrence.
      JUNIPER_CANOPY_CASCOR_WS_ORIGIN: "${JUNIPER_CANOPY_CASCOR_WS_ORIGIN:-http://juniper-canopy:8050}"
      JUNIPER_CANOPY_LOG_FORMAT: "${CANOPY_LOG_FORMAT:-text}"
      JUNIPER_CANOPY_SENTRY_DSN: "${CANOPY_SENTRY_DSN:-}"
      JUNIPER_CANOPY_METRICS_ENABLED: "${CANOPY_METRICS_ENABLED:-false}"
      # SEC-16 parity with juniper-data and juniper-cascor (juniper-canopy
      # #331, consuming juniper-observability 0.3.0's
      # ``MetricsAuthMiddleware``): IP allowlist for the Prometheus
      # ``/metrics`` mount. JSON list of IP literals or CIDR ranges.
      # Defaults to loopback only; override via
      # ``JUNIPER_CANOPY_METRICS_TRUSTED_IPS`` (set in
      # ``.env.observability`` to include the Docker bridge subnets so
      # ``make monitor`` brings Prometheus's juniper-canopy target ``up``
      # out of the box). See
      # notes/poc/POC_REMEDIATION_PLAN_2026-05-27.md §6.
      JUNIPER_CANOPY_METRICS_TRUSTED_IPS: "${JUNIPER_CANOPY_METRICS_TRUSTED_IPS:-[\"127.0.0.1\",\"::1\"]}"
      REDIS_URL: "redis://redis:6379/0"
    secrets:
      - canopy_api_key
      - juniper_cascor_api_keys
      - juniper_data_api_keys
    depends_on:
      juniper-data:
        condition: service_healthy
      juniper-cascor:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8050/v1/health', timeout=5)"]
      <<: *healthcheck-canopy
    networks:
      - backend
      - data
      - frontend
    deploy:
      <<: *resources-light
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # juniper-canopy-demo — Dashboard pointing at demo CasCor (port 8050)
  # Demo profile only: connects to juniper-cascor-demo for live demo
  # ═══════════════════════════════════════════════════════════════════════════
  juniper-canopy-demo:
    profiles: ["demo"]
    build:
      context: ../juniper-canopy
      dockerfile: Dockerfile
      args:
        GIT_SHA: "${GIT_SHA_CANOPY:-}"
        BUILD_DATE: "${BUILD_DATE:-}"
        APP_VERSION: "${APP_VERSION_CANOPY:-}"
    image: juniper-canopy:latest
    container_name: juniper-canopy-demo
    ports:
      - "${BIND_HOST:-127.0.0.1}:${CANOPY_PORT:-8050}:${CANOPY_PORT:-8050}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      JUNIPER_CANOPY_JUNIPER_DATA_URL: "http://juniper-data:8100"
      JUNIPER_CANOPY_CASCOR_SERVICE_URL: "http://juniper-cascor-demo:8200"
      # A1-iv: recurrence (LMU) runs as one service across profiles (no demo variant)
      # and joins the ``demo`` profile, so the demo dashboard reaches it directly.
      JUNIPER_CANOPY_RECURRENCE_SERVICE_URL: "http://juniper-recurrence:8210"
      JUNIPER_CANOPY_SERVER__HOST: "0.0.0.0"
      JUNIPER_CANOPY_SERVER__PORT: "8050"
      # Origin header canopy-demo sends to cascor-demo on the /ws/control
      # upgrade. Default in canopy's settings is ``http://juniper-canopy:8050``
      # which is correct for the canonical full-profile flow but wrong for
      # the demo profile (canopy-demo's actual hostname is
      # ``juniper-canopy-demo``); cascor-demo's allowlist (above on the
      # juniper-cascor-demo service) is paired with this value so the two
      # ends agree on the demo identity. Without this override every
      # /ws/control upgrade gets 403-rejected, breaking canopy↔cascor
      # interactive control under the demo profile.
      JUNIPER_CANOPY_CASCOR_WS_ORIGIN: "${JUNIPER_CANOPY_CASCOR_WS_ORIGIN:-http://juniper-canopy-demo:8050}"
      # DEPLOY-10: rate-limit even in the demo profile (see cascor-demo notes).
      JUNIPER_CANOPY_RATE_LIMIT_ENABLED: "${CANOPY_RATE_LIMIT_ENABLED:-true}"
      JUNIPER_CANOPY_RATE_LIMIT_REQUESTS_PER_MINUTE: "${CANOPY_RATE_LIMIT_REQUESTS_PER_MINUTE:-60}"
      # ``make obs-demo`` loads ``.env.observability`` which sets
      # ``CANOPY_METRICS_ENABLED=true``; default off matches the canonical
      # ``juniper-canopy`` service so the demo service has no /metrics
      # endpoint when run without the observability profile.
      JUNIPER_CANOPY_METRICS_ENABLED: "${CANOPY_METRICS_ENABLED:-false}"
      # SEC-16 / POC §6: ``MetricsAuthMiddleware`` gates ``/metrics`` by IP
      # allowlist. ``make obs-demo`` loads ``.env.observability`` which
      # widens the default loopback-only allowlist to cover the compose
      # bridge subnets so prometheus can scrape this container. Same
      # mechanism as the canonical ``juniper-canopy`` service above.
      JUNIPER_CANOPY_METRICS_TRUSTED_IPS: "${JUNIPER_CANOPY_METRICS_TRUSTED_IPS:-[\"127.0.0.1\",\"::1\"]}"
    depends_on:
      juniper-data:
        condition: service_healthy
      juniper-cascor-demo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8050/v1/health', timeout=5)"]
      <<: *healthcheck-canopy
    networks:
      - backend
      - data
      - frontend
    deploy:
      <<: *resources-light
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # juniper-canopy-dev — Dashboard in demo mode (port 8050)
  # Dev profile only: runs canopy with JUNIPER_CANOPY_DEMO_MODE for frontend dev
  # ═══════════════════════════════════════════════════════════════════════════
  juniper-canopy-dev:
    profiles: ["dev"]
    build:
      context: ../juniper-canopy
      dockerfile: Dockerfile
      args:
        GIT_SHA: "${GIT_SHA_CANOPY:-}"
        BUILD_DATE: "${BUILD_DATE:-}"
        APP_VERSION: "${APP_VERSION_CANOPY:-}"
    image: juniper-canopy:latest
    container_name: juniper-canopy-dev
    ports:
      - "${BIND_HOST:-127.0.0.1}:${CANOPY_PORT:-8050}:${CANOPY_PORT:-8050}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - data
      - frontend
    environment:
      JUNIPER_CANOPY_DEMO_MODE: "true"
      JUNIPER_CANOPY_JUNIPER_DATA_URL: "http://juniper-data:8100"
      JUNIPER_CANOPY_SERVER__HOST: "0.0.0.0"
      JUNIPER_CANOPY_SERVER__PORT: "8050"
      # DEPLOY-10: rate-limit even when running canopy in dev/demo mode.
      JUNIPER_CANOPY_RATE_LIMIT_ENABLED: "${CANOPY_RATE_LIMIT_ENABLED:-true}"
      JUNIPER_CANOPY_RATE_LIMIT_REQUESTS_PER_MINUTE: "${CANOPY_RATE_LIMIT_REQUESTS_PER_MINUTE:-60}"
    depends_on:
      juniper-data:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8050/v1/health', timeout=5)"]
      <<: *healthcheck-canopy
    deploy:
      <<: *resources-light
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # Prometheus — Metrics Collection (port 9090)
  # ═══════════════════════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: juniper-prometheus
    profiles: ["observability"]
    command:
      # ``PROMETHEUS_CONFIG_FILE`` lets ``make obs-demo`` swap in
      # ``prometheus.demo.yml`` (which scrapes ``juniper-{cascor,canopy}-demo``)
      # without forking a parallel prometheus service. Default
      # ``prometheus.yml`` is the canonical full-profile config.
      - "--config.file=/etc/prometheus/${PROMETHEUS_CONFIG_FILE:-prometheus.yml}"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
    networks:
      - backend
      - data
      - frontend
      - monitoring
    deploy:
      <<: *resources-light
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # AlertManager — Alert Routing (port 9093)
  # Receives alerts from Prometheus (see prometheus.yml `alerting.alertmanagers`)
  # and dispatches them to configured receivers in alertmanager/alertmanager.yml.
  # ═══════════════════════════════════════════════════════════════════════════
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: juniper-alertmanager
    profiles: ["observability"]
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      # Single-node deploy: disable the gossip/HA mesh. Otherwise alertmanager
      # tries to auto-discover a private IP on the container's NIC and fails
      # with "couldn't deduce an advertise address: no private IP found,
      # explicit advertise addr not provided" → "Failed to get final advertise
      # address" → exit 1 → restart loop. When this stack scales to multi-node
      # alertmanager, replace with `--cluster.advertise-address=<reachable-host:port>`
      # and set `--cluster.peer=<other-node>` per
      # https://prometheus.io/docs/alerting/latest/clustering/.
      - "--cluster.listen-address="
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    # OBS-ROUTE-01: SMTP password for email receivers is mounted as a
    # Docker secret (NOT an env var) and referenced by alertmanager.yml
    # via `smtp_auth_password_file: /run/secrets/alertmanager_smtp_password`.
    # Alertmanager does not natively substitute env vars in YAML, so the
    # `_file:` indirection is the supported path.  The file at
    # ${ALERTMANAGER_SMTP_PASSWORD_FILE} is the real secret-of-record
    # source; the canonical encrypted copy lives in `.env.secrets.enc`.
    # See notes/ALERTMANAGER_NOTIFICATION_RUNBOOK.md.
    secrets:
      - alertmanager_smtp_password
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9093/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      <<: *resources-tiny
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # Grafana — Metrics Dashboard (host port 3001 → container 3000)
  # Host port is 3001 by default because port 3000 is commonly held by a
  # system-installed Grafana deb package (`apt install grafana`) running as
  # the `grafana` user. Override via GRAFANA_HOST_PORT if 3001 is also taken.
  # ═══════════════════════════════════════════════════════════════════════════
  grafana:
    image: grafana/grafana:12.4.0
    container_name: juniper-grafana
    profiles: ["observability"]
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"
    networks:
      - monitoring
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/provisioning/dashboards/juniper-overview.json"
    secrets:
      - grafana_admin_password
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      <<: *resources-light
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # Redis — Session/cache store for juniper-canopy
  # ═══════════════════════════════════════════════════════════════════════════
  redis:
    image: redis:7.4-alpine
    container_name: juniper-redis
    profiles: ["full", "test"]
    # SEC-F15: container hardening parity with the first-party app services
    # (juniper-data/cascor/cascor-worker/recurrence/canopy). Stock
    # redis:7.4-alpine needs no special Linux capabilities, so cap_drop:[ALL]
    # is safe. See notes/JUNIPER_STACK_SECURITY_AUDIT_PLAN_2026-07-02.md §4.5.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *healthcheck-redis
    deploy:
      <<: *resources-tiny
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # Test Runner — Integration test container (runs once and exits)
  # Packages the test suite for containerized execution.
  # ═══════════════════════════════════════════════════════════════════════════
  test-runner:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: juniper-test-runner
    environment:
      JUNIPER_TEST_DATA_URL: http://juniper-data:8100
      JUNIPER_TEST_CASCOR_URL: http://juniper-cascor:8200
      JUNIPER_TEST_CANOPY_URL: http://juniper-canopy:8050
    depends_on:
      juniper-data:
        condition: service_healthy
      juniper-cascor:
        condition: service_healthy
      juniper-canopy:
        condition: service_healthy
    networks:
      - backend
      - frontend

# ═══════════════════════════════════════════════════════════════════════════
# Secrets — File-based secrets mounted at /run/secrets/<name>
#
# Defaults below point at `./secrets/<name>.txt`, which is populated by
# `bash scripts/prepare_secrets.bash` (chained by `make up`). When the
# canonical SOPS bundle (`.env.secrets.enc`) decrypts on this host, each
# file carries the real value; otherwise the script touches a 0-byte
# placeholder which cascor's `_parse_api_keys` validator (juniper-cascor#311)
# and canopy's `get_secret()` helper treat as "auth disabled".
#
# This is the symmetric-mount design: every service that mounts a given
# named secret (e.g. `juniper_cascor_api_keys`) resolves to the SAME source
# file, so canopy + cascor + worker always see byte-identical content. The
# earlier default of `./secrets.example/…` allowed `--env-file .env.local`
# to override *some* of the mounts but not their siblings, producing an
# asymmetric state where canopy sent the placeholder and cascor accepted a
# populated token — every canopy → cascor call returned `401 Invalid API
# key`. See notes/SECRET_MOUNT_SYMMETRY_2026-05-28.md.
#
# To bring the stack up without SOPS access (fresh clone): `bash
# scripts/prepare_secrets.bash` first; then `docker compose up`. The
# `.env.local` PoC override is no longer required for symmetry.
# `cascor_sentry_dsn`, `grafana_admin_password`, and
# `alertmanager_smtp_password` retain `./secrets.example/…` defaults
# because they are not part of the canopy ↔ cascor auth path.
# ═══════════════════════════════════════════════════════════════════════════
secrets:
  juniper_data_api_keys:
    file: "${JUNIPER_DATA_API_KEYS_FILE:-./secrets/juniper_data_api_keys.txt}"
  juniper_cascor_api_key:
    file: "${JUNIPER_CASCOR_API_KEY_FILE:-./secrets/juniper_cascor_api_key.txt}"
  juniper_cascor_api_keys:
    file: "${JUNIPER_CASCOR_API_KEYS_FILE:-./secrets/juniper_cascor_api_keys.txt}"
  cascor_sentry_dsn:
    file: "${CASCOR_SENTRY_DSN_FILE:-./secrets.example/cascor_sentry_dsn.txt}"
  canopy_api_key:
    file: "${CANOPY_API_KEY_FILE:-./secrets/canopy_api_key.txt}"
  cascor_auth_token:
    file: "${CASCOR_AUTH_TOKEN_FILE:-./secrets/cascor_auth_token.txt}"
  grafana_admin_password:
    file: "${GRAFANA_ADMIN_PASSWORD_FILE:-./secrets.example/grafana_admin_password.txt}"
  # OBS-ROUTE-01: SMTP auth password for the alertmanager email receivers
  # (`default`, `critical`, `tickets`).  Default points at the example
  # placeholder so `docker compose --profile observability up` works
  # out of the box; the canonical encrypted copy lives in `.env.secrets.enc`.
  # Decrypt + write to `secrets/alertmanager_smtp_password.txt` before
  # production paging matters.  See notes/ALERTMANAGER_NOTIFICATION_RUNBOOK.md.
  alertmanager_smtp_password:
    file: "${ALERTMANAGER_SMTP_PASSWORD_FILE:-./secrets.example/alertmanager_smtp_password.txt}"

# ═══════════════════════════════════════════════════════════════════════════
# Networks
# ═══════════════════════════════════════════════════════════════════════════
networks:
  # SEC-F19 / D5 — deterministic metrics subnets (design: juniper-ml
  # notes/JUNIPER_CANOPY_CONTROL_SURFACE_AUTH_AND_NAT_DESIGN_2026-07-03.md §5 Option C1).
  # Each network is pinned to a STATIC ipam.config.subnet so Prometheus's scrape
  # source address is deterministic and the `*_METRICS_TRUSTED_IPS` allowlist in
  # .env.observability can be pinned to EXACTLY these CIDRs. The two MUST AGREE —
  # enforced by tests/test_compose_metrics_subnet_alignment.py so they cannot drift.
  # Previously there was no ipam block: Docker assigned subnets dynamically and the
  # live bridge drifted to 172.23.0.0/16 — outside the old 172.18–21 allowlist
  # (audit HO-3) — yielding either a 403 scrape failure (availability) or a
  # too-wide allowlist (authorization).
  #
  # Subnet choice (design §8 OQ-3 / §9 R3 — must avoid collision with other host
  # Docker networks): the top four /16s of Docker's default address pool
  # (172.17–172.31). The default bridge holds 172.17.0.0/16 and Docker auto-assigns
  # user networks bottom-up from 172.18, so pinning the TOP avoids both
  # auto-assignment and the audit's observed 172.23. Collision-checked 2026-07-04
  # against the host daemon (`docker network inspect`): only 172.17.0.0/16 (the
  # default bridge) was allocated — 172.28.0.0/16 … 172.31.0.0/16 all free.
  #
  # These CIDRs are NETWORK-SCOPE AUTHORIZATION (which subnets may scrape), backed
  # by internal:true isolation on backend/data and the fail-closed
  # MetricsAuthMiddleware — NOT per-host authentication. SEC-F19: Docker NAT
  # collapses every client to the bridge gateway, so per-IP identity is unreliable
  # inside the NAT; do not read these CIDRs as a per-client authenticator.
  backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/16
  data:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/16
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16

