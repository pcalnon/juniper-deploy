#####################################################################################################################################################################################################
# Project:       Juniper
# Application:   juniper-deploy
# File Name:     docker-compose.yml
# Author:        Paul Calnon
#
# Date Created:  2026-02-25
# Last Modified: 2026-03-02
#
# License:       MIT License
# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:
#    Docker Compose configuration for the Juniper full-stack deployment.
#    Supports multiple profiles for different operational modes:
#
#      full           — All real services (production-like)
#      demo           — Real services with auto-configured CasCor training
#      dev            — Real data + cascor, canopy in demo mode (frontend dev)
#      test           — Integration test suite (starts services + test-runner)
#      observability  — Prometheus + Grafana monitoring stack
#
# Usage:
#    docker compose --profile full up -d                          # Full production-like stack
#    docker compose --profile demo up -d                          # Self-running demo stack
#    docker compose --profile dev up -d                           # Development stack
#    docker compose --profile test up                             # Run integration tests
#    docker compose --profile full --profile observability up -d  # Full + monitoring
#    docker compose down                                          # Stop all services
#    docker compose logs -f                                       # Follow logs
#
#####################################################################################################################################################################################################

# ═══════════════════════════════════════════════════════════════════════════
# Health check defaults (Compose extension fields)
# These x-* keys are ignored by Docker Compose itself but are referenced via
# YAML anchors so a single source of truth drives every service's healthcheck
# block. The defaults match the previously hardcoded values, and each value
# can be overridden per-service or via .env (see .env.example).
#
# Wave 1 of the hardcoded-values refactor only DEFINES these anchors. Wiring
# them into the actual service healthcheck blocks happens in Wave 4 (task 4.1)
# so this commit is non-behavioral.
# ═══════════════════════════════════════════════════════════════════════════
x-healthcheck-defaults: &healthcheck-defaults
  interval: ${HEALTHCHECK_INTERVAL:-15s}
  timeout: ${HEALTHCHECK_TIMEOUT:-10s}
  retries: ${HEALTHCHECK_RETRIES:-5}
  start_period: ${HEALTHCHECK_START_PERIOD:-10s}

x-healthcheck-cascor: &healthcheck-cascor
  interval: ${HEALTHCHECK_INTERVAL:-15s}
  timeout: ${HEALTHCHECK_TIMEOUT:-10s}
  retries: ${HEALTHCHECK_RETRIES:-5}
  start_period: ${HEALTHCHECK_START_PERIOD_CASCOR:-15s}

x-healthcheck-canopy: &healthcheck-canopy
  interval: ${HEALTHCHECK_INTERVAL:-15s}
  timeout: ${HEALTHCHECK_TIMEOUT:-10s}
  retries: ${HEALTHCHECK_RETRIES:-5}
  start_period: ${HEALTHCHECK_START_PERIOD_CANOPY:-20s}

x-healthcheck-worker: &healthcheck-worker
  interval: ${HEALTHCHECK_WORKER_INTERVAL:-30s}
  timeout: ${HEALTHCHECK_WORKER_TIMEOUT:-10s}
  retries: ${HEALTHCHECK_WORKER_RETRIES:-3}
  start_period: ${HEALTHCHECK_WORKER_START_PERIOD:-15s}

x-healthcheck-redis: &healthcheck-redis
  interval: ${HEALTHCHECK_REDIS_INTERVAL:-10s}
  timeout: ${HEALTHCHECK_REDIS_TIMEOUT:-5s}
  retries: ${HEALTHCHECK_REDIS_RETRIES:-5}
  start_period: ${HEALTHCHECK_REDIS_START_PERIOD:-5s}

# ═══════════════════════════════════════════════════════════════════════════
# Resource limit defaults (DEPLOY-07)
# Compose v2 honors `deploy.resources.limits` via cgroups. Three tiers cover
# the workload mix: training-heavy (cascor + worker), service-light (data /
# canopy / prometheus / grafana), and tiny (alertmanager / redis). Defaults
# err on the generous side so existing dev workflows aren't OOM-killed; bump
# the corresponding RESOURCES_* env vars down to enforce tighter limits.
# ═══════════════════════════════════════════════════════════════════════════
x-resources-heavy: &resources-heavy
  resources:
    limits:
      cpus: "${RESOURCES_HEAVY_CPUS:-4.0}"
      memory: ${RESOURCES_HEAVY_MEMORY:-8G}
    reservations:
      cpus: "${RESOURCES_HEAVY_CPUS_RESERVATION:-1.0}"
      memory: ${RESOURCES_HEAVY_MEMORY_RESERVATION:-2G}

x-resources-light: &resources-light
  resources:
    limits:
      cpus: "${RESOURCES_LIGHT_CPUS:-1.0}"
      memory: ${RESOURCES_LIGHT_MEMORY:-2G}
    reservations:
      cpus: "${RESOURCES_LIGHT_CPUS_RESERVATION:-0.25}"
      memory: ${RESOURCES_LIGHT_MEMORY_RESERVATION:-256M}

x-resources-tiny: &resources-tiny
  resources:
    limits:
      cpus: "${RESOURCES_TINY_CPUS:-0.5}"
      memory: ${RESOURCES_TINY_MEMORY:-256M}
    reservations:
      cpus: "${RESOURCES_TINY_CPUS_RESERVATION:-0.1}"
      memory: ${RESOURCES_TINY_MEMORY_RESERVATION:-64M}

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # JuniperData — Dataset Generation Service (port 8100)
  # Shared across all profiles: full, demo, dev, test
  # ═══════════════════════════════════════════════════════════════════════════
  juniper-data:
    profiles: ["full", "demo", "dev", "test"]
    build:
      context: ../juniper-data
      dockerfile: Dockerfile
    image: juniper-data:latest
    container_name: juniper-data
    ports:
      - "${BIND_HOST:-127.0.0.1}:${JUNIPER_DATA_PORT:-8100}:${JUNIPER_DATA_PORT:-8100}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      JUNIPER_DATA_HOST: "${JUNIPER_DATA_HOST:-0.0.0.0}"
      JUNIPER_DATA_PORT: "${JUNIPER_DATA_PORT:-8100}"
      JUNIPER_DATA_LOG_LEVEL: "${JUNIPER_DATA_LOG_LEVEL:-INFO}"
      # DEPLOY-11: API keys are read exclusively from the Docker secret file.
      # The plain `${JUNIPER_DATA_API_KEYS:-}` env var was removed because its
      # empty default silently disabled auth when the operator didn't set it.
      # The secret file is non-empty by default (placeholder in
      # secrets.example/juniper_data_api_keys.txt) so auth is on out of the box.
      JUNIPER_DATA_API_KEYS_FILE: /run/secrets/juniper_data_api_keys
      JUNIPER_DATA_LOG_FORMAT: "${JUNIPER_DATA_LOG_FORMAT:-text}"
      JUNIPER_DATA_SENTRY_DSN: "${JUNIPER_DATA_SENTRY_DSN:-}"
      JUNIPER_DATA_METRICS_ENABLED: "${JUNIPER_DATA_METRICS_ENABLED:-false}"
      # SEC-16: IP allowlist for /metrics. JSON list of IP literals or CIDR
      # ranges. Defaults to loopback only. See notes/METRICS_AUTH_RATIONALE.md.
      JUNIPER_DATA_METRICS_TRUSTED_IPS: "${JUNIPER_DATA_METRICS_TRUSTED_IPS:-[\"127.0.0.1\",\"::1\"]}"
    volumes:
      - juniper-data-datasets:/app/data/datasets
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/v1/health', timeout=5)"]
      <<: *healthcheck-defaults
    secrets:
      - juniper_data_api_keys
    networks:
      - backend
      - data
    deploy:
      <<: *resources-light
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # JuniperCascor — CasCor Training Service (port 8200)
  # Used in full + dev profiles (standard configuration)
  # ═══════════════════════════════════════════════════════════════════════════
  juniper-cascor:
    profiles: ["full", "dev", "test"]
    build:
      context: ../juniper-cascor
      dockerfile: Dockerfile
    image: juniper-cascor:latest
    container_name: juniper-cascor
    ports:
      - "${BIND_HOST:-127.0.0.1}:${CASCOR_HOST_PORT:-8201}:${CASCOR_PORT:-8200}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      JUNIPER_DATA_URL: "${JUNIPER_DATA_URL:-http://juniper-data:8100}"
      JUNIPER_CASCOR_HOST: "${CASCOR_HOST:-0.0.0.0}"
      JUNIPER_CASCOR_PORT: "${CASCOR_PORT:-8200}"
      JUNIPER_CASCOR_LOG_LEVEL: "${CASCOR_LOG_LEVEL:-INFO}"
      JUNIPER_CASCOR_RATE_LIMIT_ENABLED: "${JUNIPER_CASCOR_RATE_LIMIT_ENABLED:-true}"
      JUNIPER_CASCOR_RATE_LIMIT_REQUESTS_PER_MINUTE: "${JUNIPER_CASCOR_RATE_LIMIT_REQUESTS_PER_MINUTE:-60}"
      # DEPLOY-11: API keys are read from secret files only. The plain
      # JUNIPER_CASCOR_API_KEYS / JUNIPER_DATA_API_KEY env vars were removed.
      JUNIPER_CASCOR_API_KEYS_FILE: /run/secrets/juniper_cascor_api_keys
      JUNIPER_DATA_API_KEY_FILE: /run/secrets/juniper_data_api_keys
      JUNIPER_CASCOR_LOG_FORMAT: "${JUNIPER_CASCOR_LOG_FORMAT:-text}"
      JUNIPER_CASCOR_SENTRY_DSN: "${JUNIPER_CASCOR_SENTRY_DSN:-}"
      JUNIPER_CASCOR_METRICS_ENABLED: "${JUNIPER_CASCOR_METRICS_ENABLED:-false}"
    volumes:
      - juniper-cascor-snapshots:/app/data
      - juniper-cascor-logs:/app/logs
    secrets:
      # `juniper_cascor_api_keys` (plural) is cascor's accept-list of API keys —
      # JUNIPER_CASCOR_API_KEYS_FILE above reads this; worker → cascor WS auth
      # silently failed for ~16 days because this mount was missing and the env
      # var pointed at a path that didn't exist in the container. The singular
      # `juniper_cascor_api_key` remains because canopy reads a single key from
      # the same secret name on its side of the wire.
      - juniper_cascor_api_keys
      - juniper_cascor_api_key
      - cascor_sentry_dsn
    depends_on:
      juniper-data:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/v1/health', timeout=5)"]
      <<: *healthcheck-cascor
    networks:
      - backend
      - data
      - frontend
    deploy:
      <<: *resources-heavy
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # JuniperCascorWorker — Distributed Training Worker (no exposed port)
  # WebSocket client that connects to JuniperCascor for remote training tasks.
  # Used in full + test profiles. Scales via deploy.replicas.
  # ═══════════════════════════════════════════════════════════════════════════
  juniper-cascor-worker:
    profiles: ["full", "test"]
    build:
      context: ../juniper-cascor-worker
      dockerfile: Dockerfile
    image: juniper-cascor-worker:latest
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # CFG-06 (juniper-cascor-worker >= 0.4.0): canonical
      # JUNIPER_CASCOR_WORKER_* env-var names. Legacy CASCOR_* names
      # still work (with a DeprecationWarning) — operators using the
      # ``CASCOR_WORKER_SERVER_URL`` / ``CASCOR_WORKER_HEARTBEAT_INTERVAL``
      # host-side overrides keep them, only the container-side names
      # update here. AUTH_TOKEN_FILE is intentionally left alone in
      # this PR — the secret-file handling path needs a separate
      # verification before renaming.
      JUNIPER_CASCOR_WORKER_SERVER_URL: "${CASCOR_WORKER_SERVER_URL:-ws://juniper-cascor:8200/ws/v1/workers}"
      JUNIPER_CASCOR_WORKER_HEARTBEAT_INTERVAL: "${CASCOR_WORKER_HEARTBEAT_INTERVAL:-10.0}"
      # DEPLOY-09: Auth token is read exclusively from the Docker secret file
      # mounted at /run/secrets/cascor_auth_token. The plain CASCOR_AUTH_TOKEN
      # env var was removed to keep the secret out of `docker inspect`, env
      # dumps, and accidentally-committed `.env` files.
      CASCOR_AUTH_TOKEN_FILE: /run/secrets/cascor_auth_token
    secrets:
      - cascor_auth_token
    depends_on:
      juniper-cascor:
        condition: service_healthy
    # The legacy `kill -0 1` healthcheck only proved that PID 1 had not crashed.
    # It hid 16 days of silent worker → cascor WebSocket failure: workers stayed
    # `(healthy)` in `docker ps` while their WS connection retried fruitlessly.
    # Probing the worker's own /v1/health/ready endpoint (METRICS-MON R1.3 /
    # seed-04) flips the container to `(unhealthy)` the moment _connection is
    # not bound or the registration handshake hasn't completed — exactly the
    # state we want surfaced.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8210/v1/health/ready', timeout=5)"]
      <<: *healthcheck-worker
    networks:
      - backend
    deploy:
      <<: *resources-heavy
      replicas: ${WORKER_REPLICAS:-2}
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # JuniperCascor Demo — Auto-start CasCor training (port 8200)
  # Used in demo profile only. Starts with auto-configured training session.
  # ═══════════════════════════════════════════════════════════════════════════
  juniper-cascor-demo:
    profiles: ["demo"]
    build:
      context: ../juniper-cascor
      dockerfile: Dockerfile
    image: juniper-cascor:latest
    container_name: juniper-cascor-demo
    ports:
      - "${BIND_HOST:-127.0.0.1}:${CASCOR_HOST_PORT:-8201}:${CASCOR_PORT:-8200}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      JUNIPER_DATA_URL: "http://juniper-data:8100"
      JUNIPER_CASCOR_HOST: "0.0.0.0"
      JUNIPER_CASCOR_PORT: "8200"
      JUNIPER_CASCOR_LOG_LEVEL: "INFO"
      # DEPLOY-10: rate-limiting on by default even in demo profiles. Auth
      # remains intentionally disabled here so the demo is open-by-design,
      # but unbounded request rates would still let a single client knock
      # the demo over.
      JUNIPER_CASCOR_RATE_LIMIT_ENABLED: "${JUNIPER_CASCOR_RATE_LIMIT_ENABLED:-true}"
      JUNIPER_CASCOR_RATE_LIMIT_REQUESTS_PER_MINUTE: "${JUNIPER_CASCOR_RATE_LIMIT_REQUESTS_PER_MINUTE:-60}"
      # --- Demo auto-start configuration ---
      JUNIPER_CASCOR_AUTO_START: "true"
      JUNIPER_CASCOR_AUTO_DATASET: "spiral"
      JUNIPER_CASCOR_AUTO_DATASET_PARAMS: '{"n_spirals": 2, "n_points_per_spiral": 200, "noise": 0.15, "seed": 42}'
      JUNIPER_CASCOR_AUTO_NETWORK: '{"input_size": 2, "output_size": 2, "learning_rate": 0.01}'
      JUNIPER_CASCOR_AUTO_TRAIN_EPOCHS: "500"
    volumes:
      - juniper-cascor-snapshots:/app/data
      - juniper-cascor-logs:/app/logs
    depends_on:
      juniper-data:
        condition: service_healthy
      demo-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8200/v1/health', timeout=5)"]
      <<: *healthcheck-cascor
    networks:
      - backend
      - data
      - frontend
    deploy:
      <<: *resources-heavy
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # Demo Dataset Seeder — Init container (runs once and exits)
  # Seeds a canonical spiral dataset in JuniperData for demo use.
  # ═══════════════════════════════════════════════════════════════════════════
  demo-seed:
    profiles: ["demo"]
    image: juniper-data:latest
    container_name: juniper-demo-seed
    entrypoint:
      - python
      - -c
      - |
        import urllib.request, json, time, sys
        base = 'http://juniper-data:8100/v1'
        for i in range(30):
            try:
                urllib.request.urlopen(f'{base}/health', timeout=5)
                break
            except Exception:
                time.sleep(2)
        else:
            sys.exit(1)
        params = json.dumps({
            'generator': 'spiral',
            'params': {'n_spirals': 2, 'n_points_per_spiral': 200, 'noise': 0.15, 'seed': 42},
            'persist': True
        }).encode()
        req = urllib.request.Request(f'{base}/datasets', data=params,
            headers={'Content-Type': 'application/json'})
        resp = urllib.request.urlopen(req, timeout=30)
        print(f'Demo dataset created: {json.loads(resp.read())}')
    depends_on:
      juniper-data:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  # ═══════════════════════════════════════════════════════════════════════════
  # juniper-canopy — Monitoring Dashboard (port 8050)
  # Full profile only: connects to real CasCor service
  # ═══════════════════════════════════════════════════════════════════════════
  juniper-canopy:
    profiles: ["full", "test"]
    build:
      context: ../juniper-canopy
      dockerfile: Dockerfile
    image: juniper-canopy:latest
    container_name: juniper-canopy
    ports:
      - "${BIND_HOST:-127.0.0.1}:${CANOPY_PORT:-8050}:${CANOPY_PORT:-8050}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      JUNIPER_CANOPY_JUNIPER_DATA_URL: "${JUNIPER_DATA_URL:-http://juniper-data:8100}"
      JUNIPER_CANOPY_CASCOR_SERVICE_URL: "${CASCOR_SERVICE_URL:-http://juniper-cascor:8200}"
      JUNIPER_CANOPY_SERVER__HOST: "${CANOPY_HOST:-0.0.0.0}"
      JUNIPER_CANOPY_SERVER__PORT: "${CANOPY_PORT:-8050}"
      JUNIPER_CANOPY_RATE_LIMIT_ENABLED: "${CANOPY_RATE_LIMIT_ENABLED:-true}"
      JUNIPER_CANOPY_RATE_LIMIT_REQUESTS_PER_MINUTE: "${CANOPY_RATE_LIMIT_REQUESTS_PER_MINUTE:-60}"
      # DEPLOY-11: API keys read from secret files only. JUNIPER_CASCOR_API_KEY
      # plain env var removed.
      CANOPY_API_KEY_FILE: /run/secrets/canopy_api_key
      JUNIPER_CASCOR_API_KEY_FILE: /run/secrets/juniper_cascor_api_keys
      JUNIPER_CANOPY_LOG_FORMAT: "${CANOPY_LOG_FORMAT:-text}"
      JUNIPER_CANOPY_SENTRY_DSN: "${CANOPY_SENTRY_DSN:-}"
      JUNIPER_CANOPY_METRICS_ENABLED: "${CANOPY_METRICS_ENABLED:-false}"
      REDIS_URL: "redis://redis:6379/0"
    secrets:
      - canopy_api_key
      - juniper_cascor_api_keys
    depends_on:
      juniper-data:
        condition: service_healthy
      juniper-cascor:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8050/v1/health', timeout=5)"]
      <<: *healthcheck-canopy
    networks:
      - backend
      - data
      - frontend
    deploy:
      <<: *resources-light
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # juniper-canopy-demo — Dashboard pointing at demo CasCor (port 8050)
  # Demo profile only: connects to juniper-cascor-demo for live demo
  # ═══════════════════════════════════════════════════════════════════════════
  juniper-canopy-demo:
    profiles: ["demo"]
    build:
      context: ../juniper-canopy
      dockerfile: Dockerfile
    image: juniper-canopy:latest
    container_name: juniper-canopy-demo
    ports:
      - "${BIND_HOST:-127.0.0.1}:${CANOPY_PORT:-8050}:${CANOPY_PORT:-8050}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      JUNIPER_CANOPY_JUNIPER_DATA_URL: "http://juniper-data:8100"
      JUNIPER_CANOPY_CASCOR_SERVICE_URL: "http://juniper-cascor-demo:8200"
      JUNIPER_CANOPY_SERVER__HOST: "0.0.0.0"
      JUNIPER_CANOPY_SERVER__PORT: "8050"
      # DEPLOY-10: rate-limit even in the demo profile (see cascor-demo notes).
      JUNIPER_CANOPY_RATE_LIMIT_ENABLED: "${CANOPY_RATE_LIMIT_ENABLED:-true}"
      JUNIPER_CANOPY_RATE_LIMIT_REQUESTS_PER_MINUTE: "${CANOPY_RATE_LIMIT_REQUESTS_PER_MINUTE:-60}"
    depends_on:
      juniper-data:
        condition: service_healthy
      juniper-cascor-demo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8050/v1/health', timeout=5)"]
      <<: *healthcheck-canopy
    networks:
      - backend
      - data
      - frontend
    deploy:
      <<: *resources-light
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # juniper-canopy-dev — Dashboard in demo mode (port 8050)
  # Dev profile only: runs canopy with JUNIPER_CANOPY_DEMO_MODE for frontend dev
  # ═══════════════════════════════════════════════════════════════════════════
  juniper-canopy-dev:
    profiles: ["dev"]
    build:
      context: ../juniper-canopy
      dockerfile: Dockerfile
    image: juniper-canopy:latest
    container_name: juniper-canopy-dev
    ports:
      - "${BIND_HOST:-127.0.0.1}:${CANOPY_PORT:-8050}:${CANOPY_PORT:-8050}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - data
      - frontend
    environment:
      JUNIPER_CANOPY_DEMO_MODE: "true"
      JUNIPER_CANOPY_JUNIPER_DATA_URL: "http://juniper-data:8100"
      JUNIPER_CANOPY_SERVER__HOST: "0.0.0.0"
      JUNIPER_CANOPY_SERVER__PORT: "8050"
      # DEPLOY-10: rate-limit even when running canopy in dev/demo mode.
      JUNIPER_CANOPY_RATE_LIMIT_ENABLED: "${CANOPY_RATE_LIMIT_ENABLED:-true}"
      JUNIPER_CANOPY_RATE_LIMIT_REQUESTS_PER_MINUTE: "${CANOPY_RATE_LIMIT_REQUESTS_PER_MINUTE:-60}"
    depends_on:
      juniper-data:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8050/v1/health', timeout=5)"]
      <<: *healthcheck-canopy
    deploy:
      <<: *resources-light
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # Prometheus — Metrics Collection (port 9090)
  # ═══════════════════════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: juniper-prometheus
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
    networks:
      - backend
      - data
      - frontend
      - monitoring
    deploy:
      <<: *resources-light
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # AlertManager — Alert Routing (port 9093)
  # Receives alerts from Prometheus (see prometheus.yml `alerting.alertmanagers`)
  # and dispatches them to configured receivers in alertmanager/alertmanager.yml.
  # ═══════════════════════════════════════════════════════════════════════════
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: juniper-alertmanager
    profiles: ["observability"]
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      # Single-node deploy: disable the gossip/HA mesh. Otherwise alertmanager
      # tries to auto-discover a private IP on the container's NIC and fails
      # with "couldn't deduce an advertise address: no private IP found,
      # explicit advertise addr not provided" → "Failed to get final advertise
      # address" → exit 1 → restart loop. When this stack scales to multi-node
      # alertmanager, replace with `--cluster.advertise-address=<reachable-host:port>`
      # and set `--cluster.peer=<other-node>` per
      # https://prometheus.io/docs/alerting/latest/clustering/.
      - "--cluster.listen-address="
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    # OBS-ROUTE-01: SMTP password for email receivers is mounted as a
    # Docker secret (NOT an env var) and referenced by alertmanager.yml
    # via `smtp_auth_password_file: /run/secrets/alertmanager_smtp_password`.
    # Alertmanager does not natively substitute env vars in YAML, so the
    # `_file:` indirection is the supported path.  The file at
    # ${ALERTMANAGER_SMTP_PASSWORD_FILE} is the real secret-of-record
    # source; the canonical encrypted copy lives in `.env.secrets.enc`.
    # See notes/ALERTMANAGER_NOTIFICATION_RUNBOOK.md.
    secrets:
      - alertmanager_smtp_password
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9093/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      <<: *resources-tiny
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # Grafana — Metrics Dashboard (host port 3001 → container 3000)
  # Host port is 3001 by default because port 3000 is commonly held by a
  # system-installed Grafana deb package (`apt install grafana`) running as
  # the `grafana` user. Override via GRAFANA_HOST_PORT if 3001 is also taken.
  # ═══════════════════════════════════════════════════════════════════════════
  grafana:
    image: grafana/grafana:12.4.0
    container_name: juniper-grafana
    profiles: ["observability"]
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"
    networks:
      - monitoring
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/provisioning/dashboards/juniper-overview.json"
    secrets:
      - grafana_admin_password
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      <<: *resources-light
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # Redis — Session/cache store for juniper-canopy
  # ═══════════════════════════════════════════════════════════════════════════
  redis:
    image: redis:7.4-alpine
    container_name: juniper-redis
    profiles: ["full", "test"]
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *healthcheck-redis
    deploy:
      <<: *resources-tiny
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # Test Runner — Integration test container (runs once and exits)
  # Packages the test suite for containerized execution.
  # ═══════════════════════════════════════════════════════════════════════════
  test-runner:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: juniper-test-runner
    environment:
      JUNIPER_TEST_DATA_URL: http://juniper-data:8100
      JUNIPER_TEST_CASCOR_URL: http://juniper-cascor:8200
      JUNIPER_TEST_CANOPY_URL: http://juniper-canopy:8050
    depends_on:
      juniper-data:
        condition: service_healthy
      juniper-cascor:
        condition: service_healthy
      juniper-canopy:
        condition: service_healthy
    networks:
      - backend
      - frontend

# ═══════════════════════════════════════════════════════════════════════════
# Secrets — File-based secrets mounted at /run/secrets/<name>
# Copy secrets.example/ to secrets/ and fill in real values.
# ═══════════════════════════════════════════════════════════════════════════
secrets:
  juniper_data_api_keys:
    file: "${JUNIPER_DATA_API_KEYS_FILE:-./secrets.example/juniper_data_api_keys.txt}"
  juniper_cascor_api_key:
    file: "${JUNIPER_CASCOR_API_KEY_FILE:-./secrets.example/juniper_cascor_api_key.txt}"
  juniper_cascor_api_keys:
    file: "${JUNIPER_CASCOR_API_KEYS_FILE:-./secrets.example/juniper_cascor_api_keys.txt}"
  cascor_sentry_dsn:
    file: "${CASCOR_SENTRY_DSN_FILE:-./secrets.example/cascor_sentry_dsn.txt}"
  canopy_api_key:
    file: "${CANOPY_API_KEY_FILE:-./secrets.example/canopy_api_key.txt}"
  cascor_auth_token:
    file: "${CASCOR_AUTH_TOKEN_FILE:-./secrets.example/cascor_auth_token.txt}"
  grafana_admin_password:
    file: "${GRAFANA_ADMIN_PASSWORD_FILE:-./secrets.example/grafana_admin_password.txt}"
  # OBS-ROUTE-01: SMTP auth password for the alertmanager email receivers
  # (`default`, `critical`, `tickets`).  Default points at the example
  # placeholder so `docker compose --profile observability up` works
  # out of the box; the canonical encrypted copy lives in `.env.secrets.enc`.
  # Decrypt + write to `secrets/alertmanager_smtp_password.txt` before
  # production paging matters.  See notes/ALERTMANAGER_NOTIFICATION_RUNBOOK.md.
  alertmanager_smtp_password:
    file: "${ALERTMANAGER_SMTP_PASSWORD_FILE:-./secrets.example/alertmanager_smtp_password.txt}"

# ═══════════════════════════════════════════════════════════════════════════
# Networks
# ═══════════════════════════════════════════════════════════════════════════
networks:
  backend:
    driver: bridge
    internal: true
  data:
    driver: bridge
    internal: true
  frontend:
    driver: bridge
  monitoring:
    driver: bridge

# ═══════════════════════════════════════════════════════════════════════════
# Volumes
# ═══════════════════════════════════════════════════════════════════════════
volumes:
  juniper-data-datasets:
  juniper-cascor-snapshots:
  juniper-cascor-logs:
  grafana-data:
